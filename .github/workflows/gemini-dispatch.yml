name: Gemini CLI Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  dispatch:
    if: >-
      github.event.sender.type == 'User' &&
      startsWith(github.event.comment.body, '@gemini-cli') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.command.outputs.command }}
      request: ${{ steps.command.outputs.request }}
      additional_context: ${{ steps.command.outputs.additional_context }}
      issue_number: ${{ github.event.issue.number || github.event.pull_request.number }}
    steps:
      - name: Parse request
        id: command
        uses: actions/github-script@v7
        env:
          REQUEST: ${{ github.event.comment.body }}
        with:
          script: |
            const request = process.env.REQUEST || "";
            core.setOutput("request", request);
            if (request.startsWith("@gemini-cli /approve")) {
              core.setOutput("command", "approve");
              core.setOutput("additional_context", request.replace(/^@gemini-cli \/approve/, "").trim());
            } else {
              core.setOutput("command", "invoke");
              core.setOutput("additional_context", request.replace(/^@gemini-cli/, "").trim());
            }

      - name: Acknowledge request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "وصل طلبك إلى Gemini لمراجعته. ستظهر النتيجة هنا."

  invoke:
    needs: dispatch
    if: needs.dispatch.outputs.command == 'invoke'
    uses: ./.github/workflows/gemini-invoke.yml
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    with:
      additional_context: ${{ needs.dispatch.outputs.additional_context }}
    secrets: inherit

  plan-execute:
    needs: dispatch
    if: needs.dispatch.outputs.command == 'approve'
    uses: ./.github/workflows/gemini-plan-execute.yml
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    with:
      additional_context: ${{ needs.dispatch.outputs.additional_context }}
    secrets: inherit
