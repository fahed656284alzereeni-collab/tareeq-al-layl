name: Migration branch tests

on:
  push:
    branches:
      - supabase-migration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run automated tests
        run: npm test
      - name: Check server and Supabase module syntax
        run: |
          node --check server.js
          node --check supabase-auth-verifier.js
          node --check supabase-clients.js
          node --check supabase-profile-repository.js
          node --check supabase-profile-handlers.js
          node --check supabase-chat-repository.js
          node --check supabase-chat-handlers.js
          node --check supabase-media-handlers.js
          node --check supabase-chat-api.mjs
          node --check supabase-chat-preview.mjs

  postgres-migration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mersal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mersal_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mersal_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create a disposable Supabase-like baseline
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f test/fixtures/supabase-baseline.sql
      - name: Apply migration to disposable PostgreSQL twice
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261107100404_mersal_expand_messaging_schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261107100410_mersal_auth_profile_bootstrap.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261107110200_move_auth_helpers_private.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261107100404_mersal_expand_messaging_schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261107100410_mersal_auth_profile_bootstrap.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261107110200_move_auth_helpers_private.sql
      - name: Verify RPCs, backfill, receipts, profile permissions, and negative RLS cases
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f test/fixtures/migration-integration-assertions.sql
