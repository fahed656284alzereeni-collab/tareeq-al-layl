name: Mersal web build

on:
  push:
    branches:
      - mersal-cloudflare-migration
    paths:
      - "cloud/**"
      - ".github/workflows/mersal-cloud-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cloud/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build production bundle
        run: npm run build
