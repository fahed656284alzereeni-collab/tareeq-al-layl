name: Keep Mersalo server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-server:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Ping server health endpoint
        run: |
          curl --fail --silent --show-error --max-time 25 --retry 2 --retry-delay 3 \
            https://tareeq-al-layl-server.onrender.com/health
