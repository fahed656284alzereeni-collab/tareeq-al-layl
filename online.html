<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>طريق الليل - الطاولات</title>

<style>

body{visibility:hidden;font-family:Arial,sans-serif;background:#101820;color:white;padding:18px;line-height:1.8}

h1,h2{text-align:center}

section{background:#1d2b36;padding:15px;margin:14px 0;border-radius:12px}

input,button{font-size:18px;padding:12px;margin:6px 0;width:100%;box-sizing:border-box;border-radius:8px}

input{background:white;color:black;border:1px solid #aaa}

button{background:#176b58;color:white;border:0}

button:focus,input:focus{outline:3px solid #ffd166}

#rooms button{background:#29465b}

#messages{height:180px;overflow:auto;background:#0b1218;padding:10px}

.notice{color:#ffd166}

#micButton{background:#176b58;font-weight:bold}

#micButton.off{background:#8b2525}

</style>

</head>

<body>

<h1>طريق الليل</h1>

<p>لعبة قيادة جماعية للمكفوفين</p>

<section>

<h2>بيانات اللاعب</h2>

<label for="playerName">اسم اللاعب</label>

<input id="playerName" value="" autocomplete="nickname" required>

</section>

<section>

<h2>إنشاء طاولة جديدة</h2>

<label for="roomName">اسم الطاولة</label>

<input id="roomName" value="" required>

<button onclick="createRoom()">إنشاء طاولة عامة</button>

<button onclick="createPrivateRoom()">إنشاء طاولة خاصة</button>

</section>

<section>
<h2>اللاعبون المتصلون</h2>
<div id="onlinePlayers" aria-live="polite">بانتظار الاتصال...</div>
</section>

<section>
<h2>دعوات الطاولات</h2>
<div id="invitations" aria-live="assertive">لا توجد دعوات جديدة</div>
</section>

<section>

<h2>الطاولات العامة</h2>

<button onclick="loadRooms()">تحديث قائمة الطاولات</button>

<div id="rooms" aria-live="polite">جاري الاتصال...</div>

</section>



<section>

<h2>الطاولة الحالية</h2>

<p id="status" aria-live="polite">لم تنضم إلى طاولة بعد</p>

<button onclick="togglePrivacy()">تغيير خصوصية الطاولة</button>

<button onclick="leaveRoom()">مغادرة الطاولة</button>

<h2>اللاعبون</h2>

<div id="players" aria-live="polite"></div>

</section>
 <section>

<h2>المحادثة الصوتية</h2>

<p id="voiceStatus" role="status" aria-live="polite">الميكروفون مغلق</p>

<button id="micButton" class="off" aria-pressed="false" onclick="toggleMicrophone()">

تشغيل الميكروفون

</button>

<div id="remoteAudio"></div>

</section>

<section>

<h2>المحادثة الكتابية</h2>

<div id="messages" aria-live="polite"></div>

<label for="message">اكتب رسالتك</label>

<input id="message">

<button onclick="sendMessage()">إرسال الرسالة</button>

</section>

<p id="notice" class="notice" role="status" aria-live="assertive"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const app = initializeApp({
  apiKey: "AIzaSyDQZpAJgNCqd4iXyJyN9zFC-8LneS_UWQs",
  authDomain: "tareeq-al-layl.firebaseapp.com",
  projectId: "tareeq-al-layl",
  storageBucket: "tareeq-al-layl.firebasestorage.app",
  messagingSenderId: "1071185437335",
  appId: "1:1071185437335:web:4ca6e3f87152f9ef68ffd2"
});
const auth = getAuth(app);
const db = getFirestore(app);
onAuthStateChanged(auth, async user => {
  if (!user) { location.replace("login.html"); return; }
  try {
    const profile = await getDoc(doc(db, "users", user.uid));
    const name = profile.exists() ? String(profile.data().playerName || "").trim() : "";
    if (!name) { location.replace("login.html"); return; }
    window.getGameToken = () => auth.currentUser.getIdToken();
    window.currentUserUid = user.uid;
    const field = document.getElementById("playerName");
    field.value = name;
    field.readOnly = true;
    field.setAttribute("aria-label", "اسم اللاعب المحفوظ في الحساب");
    document.body.style.visibility = "visible";
    window.dispatchEvent(new Event("game-auth-ready"));
  } catch (error) {
    location.replace("login.html");
  }
});
</script>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<script>

const SERVER="https://tareeq-al-layl-server.onrender.com";

const socket=io(SERVER,{autoConnect:false,auth: async callback => { try { callback({token: await window.getGameToken()}); } catch (error) { callback({token: ""}); } }});
window.addEventListener("game-auth-ready",()=>socket.connect(),{once:true});

let currentRoom="";

let isHost=false;

let isPrivate=false;

let localStream=null;

let microphoneOn=false;

let players=[];\nlet lastOnlinePlayers=[];

const peers=new Map();

const el=id=>document.getElementById(id);

function say(t){el("notice").textContent=t;}

socket.on("connect",()=>{

say("تم الاتصال بالخادم");

loadRooms();

});

socket.on("connect_error",()=>{

say("تعذر الاتصال بالخادم");

});

socket.on("publicRooms",showRooms);
socket.on("onlinePlayers",list=>{lastOnlinePlayers=list||[];showOnlinePlayers(lastOnlinePlayers);});
socket.on("roomInvitation",invitation=>{
  const area=el("invitations");
  const row=document.createElement("div");
  const label=document.createElement("p");
  label.textContent="دعوة من "+invitation.inviterName+" إلى طاولة "+invitation.roomName;
  const accept=document.createElement("button");
  accept.textContent="قبول الدعوة";
  accept.onclick=()=>{
    socket.emit("acceptRoomInvitation",{roomId:invitation.roomId},result=>{
      if(!result.success){say(result.message);row.remove();return;}
      currentRoom=result.room.code;
      isHost=false;
      isPrivate=true;
      el("status").textContent="انضممت إلى الطاولة: "+result.room.name;
      say("تم قبول الدعوة والانضمام إلى الطاولة");
      row.remove();
    });
  };
  row.append(label,accept);
  area.replaceChildren(row);
  say("وصلتك دعوة جديدة إلى طاولة خاصة");
});

socket.on("playersUpdate",list=>{

players=list||[];

showPlayers(players);

syncVoicePeers();

});

socket.on("roomPrivacy",data=>{

isPrivate=data.privateRoom;

say(isPrivate?"الطاولة خاصة":"الطاولة عامة");

});

socket.on("chatMessage",data=>{

const p=document.createElement("p");

p.textContent=data.name+": "+data.message;

el("messages").appendChild(p);

});

socket.on("systemMessage",say);

function showOnlinePlayers(list){
  const area=el("onlinePlayers");
  area.replaceChildren();
  const others=(list||[]).filter(p=>p.uid!==window.currentUserUid);
  if(!others.length){area.textContent="لا يوجد لاعبون متصلون حاليا";return;}
  others.forEach(player=>{
    const row=document.createElement("div");
    const label=document.createElement("p");
    label.textContent=player.name+"، متصل الآن";
    row.appendChild(label);
    if(currentRoom&&isHost&&isPrivate){
      const invite=document.createElement("button");
      invite.textContent="دعوة إلى الطاولة الخاصة";
      invite.onclick=()=>socket.emit("invitePlayer",{targetUid:player.uid},result=>{
        say(result.success?"تم إرسال الدعوة إلى "+player.name:result.message);
      });
      row.appendChild(invite);
    }
    area.appendChild(row);
  });
}
function playerName(){

return el("playerName").value.trim();

}

function createRoom(){makeRoom(false);}

function createPrivateRoom(){makeRoom(true);}

function makeRoom(privateMode){
const player=playerName();
const roomTitle=el("roomName").value.trim();
if(!player||!roomTitle){say("أدخل اسم اللاعب واسم الطاولة أولا.");return;}
socket.emit("createRoom",{

name:el("roomName").value.trim(),

playerName:player,
privateRoom:privateMode

},r=>{

if(!r.success){say("تعذر إنشاء الطاولة");return;}

currentRoom=r.code;

isHost=true;

if(privateMode){
 socket.emit("setRoomPrivacy",{privateRoom:true},()=>{});

}



el("status").textContent="أنت مالك الطاولة.";

say("تم إنشاء الطاولة بنجاح.");

});

}

function loadRooms(){

socket.emit("getPublicRooms",showRooms);

}

function showRooms(list){

const area=el("rooms");

area.replaceChildren();

if(!list||!list.length){

area.textContent="لا توجد طاولات عامة حاليا";

return;

}

list.forEach(room=>{

const b=document.createElement("button");

b.textContent=room.name+"، عدد اللاعبين: "+room.playerCount;

b.onclick=()=>{

joinRoom(room.code);

};

area.appendChild(b);

});

}

function joinRoom(code){
const name=playerName();
if(!name){say("اسم اللاعب مطلوب.");return;}
if(!code){say("اختر طاولة من القائمة.");return;}

socket.emit("joinRoom",{code,name:playerName()},r=>{

if(!r.success){say(r.message);return;}

currentRoom=r.code;

isHost=false;

el("status").textContent="انضممت إلى الطاولة: "+r.room.name;
 say("تم الانضمام بنجاح");

});

}

function togglePrivacy(){

if(!currentRoom){say("انضم إلى طاولة أولا");return;}

if(!isHost){say("تغيير الخصوصية متاح لمالك الطاولة فقط");return;}

socket.emit("setRoomPrivacy",{privateRoom:!isPrivate},r=>{

if(r.success)say(r.privateRoom?"أصبحت الطاولة خاصة":"أصبحت الطاولة عامة");

else say(r.message);

});

}

function showPlayers(list){

const area=el("players");

area.replaceChildren();

if(!list||!list.length){

area.textContent="لا يوجد لاعبون";

return;

}

list.forEach(p=>{

const line=document.createElement("p");

line.textContent=p.name+(p.host?"، مالك الطاولة":"");

area.appendChild(line);

});

}

function sendMessage(){

const message=el("message").value.trim();

if(!currentRoom){say("انضم إلى طاولة أولا");return;}

if(!message){say("اكتب رسالة أولا");return;}

socket.emit("chatMessage",message);

el("message").value="";

}

/* المحادثة الصوتية */

function updateMicButton(){

const button=el("micButton");
 button.setAttribute("aria-pressed",String(microphoneOn));

if(microphoneOn){

button.textContent="إيقاف الميكروفون";

button.classList.remove("off");

el("voiceStatus").textContent="الميكروفون يعمل الآن";

}else{

button.textContent="تشغيل الميكروفون";

button.classList.add("off");

el("voiceStatus").textContent="الميكروفون مغلق";

}

}

async function toggleMicrophone(){

if(!currentRoom){

say("يجب الانضمام إلى طاولة أولا");

return;

}

if(microphoneOn){

microphoneOn=false;

if(localStream){

localStream.getAudioTracks().forEach(track=>track.enabled=false);

}

updateMicButton();

say("تم إيقاف الميكروفون");

return;

}

try{

if(!localStream){

localStream=await navigator.mediaDevices.getUserMedia({audio:true});

}

localStream.getAudioTracks().forEach(track=>track.enabled=true);

microphoneOn=true;

updateMicButton();

for(const pc of peers.values()){

const sender=pc.getSenders().find(s=>s.track&&s.track.kind==="audio");

if(sender){

await sender.replaceTrack(localStream.getAudioTracks()[0]);

}else{

const transceiver=pc.getTransceivers().find(t=>t.receiver.track.kind==="audio");

if(transceiver)await transceiver.sender.replaceTrack(localStream.getAudioTracks()[0]);

}

}

say("الميكروفون يعمل. يستطيع اللاعبون سماعك");

}catch(error){

microphoneOn=false;

updateMicButton();

say("تعذر تشغيل الميكروفون. تحقق من إذن استخدام المايك");

}

}

function createPeer(peerId){

if(peers.has(peerId))return peers.get(peerId);

const pc=new RTCPeerConnection({

iceServers:[

{urls:"stun:stun.l.google.com:19302"}

]

});

const audioTransceiver=pc.addTransceiver("audio",{direction:"sendrecv"});

if(localStream&&microphoneOn){

audioTransceiver.sender.replaceTrack(localStream.getAudioTracks()[0]);

}

pc.onicecandidate=event=>{

if(event.candidate){

socket.emit("voiceSignal",{

target:peerId,

signal:{type:"candidate",candidate:event.candidate}

});

}

};

pc.ontrack=event=>{

let audio=document.getElementById("audio-"+peerId);
 if(!audio){

audio=document.createElement("audio");

audio.id="audio-"+peerId;

audio.autoplay=true;

audio.controls=true;

audio.setAttribute("aria-label","صوت لاعب من الطاولة");

el("remoteAudio").appendChild(audio);

}

audio.srcObject=event.streams[0];

audio.play().catch(()=> {

el("voiceStatus").textContent="اضغط تشغيل الصوت إذا لم تسمع اللاعبين";

});

};

pc.onconnectionstatechange=()=>{

if(pc.connectionState==="failed"||pc.connectionState==="closed"){

removePeer(peerId);

}

};

peers.set(peerId,pc);

return pc;

}

async function syncVoicePeers(){

if(!currentRoom)return;

const others=players.filter(p=>p.id&&p.id!==socket.id);

const activeIds=new Set(others.map(p=>p.id));

for(const id of peers.keys()){

if(!activeIds.has(id))removePeer(id);

}

for(const player of others){

const id=player.id;

if(peers.has(id))continue;

const pc=createPeer(id);

if(socket.id.localeCompare(id)<0){

try{

const offer=await pc.createOffer();

await pc.setLocalDescription(offer);
 socket.emit("voiceSignal",{

target:id,

signal:{type:"description",description:pc.localDescription}

});

}catch(error){

say("تعذر بدء الاتصال الصوتي مع أحد اللاعبين");

}

}

}

}

socket.on("voiceSignal",async data=>{

try{

const peerId=data.from;

const signal=data.signal;

if(!peerId||!signal)return;

const pc=createPeer(peerId);

if(signal.type==="description"){

await pc.setRemoteDescription(signal.description);

if(signal.description.type==="offer"){

const answer=await pc.createAnswer();

await pc.setLocalDescription(answer);

socket.emit("voiceSignal",{

target:peerId,

signal:{type:"description",description:pc.localDescription}

});

}

}else if(signal.type==="candidate"){

await pc.addIceCandidate(signal.candidate);

}

}catch(error){

say("حدث خطأ في الاتصال الصوتي");

}

});

function removePeer(id){

const pc=peers.get(id);

if(pc){

pc.close();

peers.delete(id);

}

const audio=document.getElementById("audio-"+id);

if(audio)audio.remove();

}

function closeVoice(){ 
for(const id of peers.keys())removePeer(id);

if(localStream){

localStream.getTracks().forEach(track=>track.stop());

localStream=null;

}

microphoneOn=false;

updateMicButton();

el("remoteAudio").replaceChildren();

}

function leaveRoom(){

if(!currentRoom){say("لست داخل طاولة");return;}

closeVoice();

socket.emit("leaveRoom");

currentRoom="";

isHost=false;

players=[];

el("status").textContent="غادرت الطاولة";

el("players").textContent="";

say("تمت مغادرة الطاولة");

loadRooms();

}

updateMicButton();

</script>

</body>

</html>
