<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>محادثات مِرسالو</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#101827;color:#f5f7fb}*{box-sizing:border-box}body{margin:0;line-height:1.7}header{padding:15px 20px;background:#1b293b;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;color:#8bd8c5;font-size:1.5rem}main{max-width:760px;margin:auto;padding:18px}.panel{background:#1b293b;border:1px solid #34445a;border-radius:16px;padding:17px;margin-bottom:16px}label{display:block;font-weight:bold;margin:12px 0 5px}input,textarea,button{font:inherit;width:100%;padding:12px;border-radius:10px;margin:5px 0}input,textarea{background:#fff;color:#111;border:2px solid #718096}button{background:#167c68;color:white;border:0;font-weight:bold}button:focus,input:focus,textarea:focus{outline:3px solid #ffd166;outline-offset:3px}.secondary{background:#42536b}.conversation{display:block;text-align:right;background:#26384e;margin:8px 0}.chatHeader{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.chatHeader h2{margin:0}.closeChat{width:auto;background:#42536b;margin:0 0 10px}.infoToggle{width:auto;background:#167c68;margin:0 0 10px}.infoPanel{background:#26384e;border:1px solid #42536b;border-radius:12px;padding:14px;margin:8px 0 14px}.infoPanel button{margin:8px 0}.infoMeta{padding:8px 0;border-bottom:1px solid #42536b}.infoActions{margin-top:12px}.messages{min-height:150px;max-height:48vh;overflow:auto;padding:8px;background:#101827;border-radius:12px}.msg{padding:10px;margin:8px 0;border-radius:12px;background:#26384e;overflow-wrap:anywhere}.mine{background:#145b50}.muted{color:#c3d0df}.tabs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tabLink{display:inline-block;padding:9px 16px;border-radius:10px;background:#26384e;color:#f5f7fb;text-decoration:none;font-weight:bold}.tabLink[aria-current="page"]{background:#167c68}.tabLink:focus{outline:3px solid #ffd166;outline-offset:3px}#chatPanel{display:none}#status{padding:10px;background:#26384e;border-radius:10px}
[hidden]{display:none!important}
body.chat-open{background:#101827}
body.chat-open header{padding:10px 16px}
body.chat-open header h1{font-size:1.2rem}
body.chat-open main{padding:12px;max-width:760px}
body.chat-open #onlineSection{display:none}
body.chat-open #status{display:none}
#chatPanel{border-radius:18px;padding:clamp(12px,3vw,20px)}
.chatHeader{align-items:stretch}
.chatHeader>div{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.chatHeader h2{font-size:1.25rem;overflow-wrap:anywhere}
.chatHeader button{width:100%;min-height:48px;margin:0;padding:10px 8px}
.infoPanel{margin:12px 0 16px;padding:clamp(12px,3vw,18px)}
.infoPanel h3{margin-top:4px}
.infoMeta{margin:0;padding:12px 2px;overflow-wrap:anywhere}
.infoActions{display:grid;grid-template-columns:1fr;gap:8px}
.infoActions button{min-height:48px;margin:0}
.messages{height:clamp(180px,35vh,360px);min-height:180px;max-height:42vh;overflow-y:auto;overscroll-behavior:contain;padding:12px}
.msg{max-width:88%;width:fit-content;padding:10px 14px;margin:8px 0;line-height:1.6}
.msg.mine{margin-right:auto}
.messageContent{margin:0 0 6px;white-space:pre-wrap}
.messageOptionsButton{display:block;width:auto;min-width:140px;min-height:44px;margin:8px 0 0;background:#42536b;border:1px solid #718096;text-align:center}
.messageOptionsButton:focus{outline:3px solid #ffd166;outline-offset:3px}
.messageActions[hidden]{display:none!important}
.messageActions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.messageActions button{width:auto;min-width:120px;min-height:44px;margin:0}
.messageActions button:focus{outline:3px solid #ffd166;outline-offset:3px}
.messageEditForm{display:grid;gap:8px;margin-top:10px}
.messageEditForm label{display:block;font-weight:bold}
.messageEditForm textarea{min-height:90px;background:#fff;color:#111}
.messageEditForm button{min-height:44px;margin:0}


#composePanel{margin-top:18px}
#composePanel h2{font-size:1.2rem;margin:0 0 10px}
#sendForm textarea{display:block;min-height:104px;resize:vertical}
#sendForm button{min-height:50px}
@media(min-width:600px){
  .infoActions{grid-template-columns:repeat(2,minmax(0,1fr))}
  .infoActions #reportAction{grid-column:1/-1}
}
</style></head><body>
<header><h1>مِرسالو</h1><nav id="mainNavigation" class="tabs" aria-label="التنقل الرئيسي"><a class="tabLink" href="chat.html" aria-current="page">الصفحة الرئيسية</a><a class="tabLink" href="settings.html">الإعدادات</a></nav></header>
<main>
<section class="panel" id="onlineSection"><h2>الأشخاص المتصلون</h2><p class="muted">تظهر هنا الحسابات المتصلة بمِرسالو حاليًا. ابحث عن الاسم لبدء محادثة.</p>
<button id="openOnline" type="button" aria-expanded="false" aria-controls="onlinePanel">عرض الأشخاص المتصلين</button>
<div id="onlinePanel" hidden><label for="onlineSearch">ابحث عن شخص بالاسم</label><input id="onlineSearch" type="search" autocomplete="off" placeholder="اكتب اسم الشخص"><div id="onlineList" aria-live="polite">جارٍ تحميل الأشخاص المتصلين...</div></div></section>
<section class="panel" id="conversationListPanel"><h2 id="conversationHeading" tabindex="-1">محادثاتك</h2><div id="conversationList" aria-live="polite"></div></section>
<section class="panel" id="chatPanel"><div class="chatHeader"><h2 id="chatTitle">المحادثة</h2><div><button id="conversationInfoButton" class="infoToggle" type="button" aria-expanded="false" aria-controls="conversationInfo">معلومات المحادثة</button><button id="closeChat" class="closeChat" type="button">إغلاق المحادثة</button></div></div><section id="conversationInfo" class="infoPanel" aria-labelledby="conversationInfoHeading" hidden><h3 id="conversationInfoHeading" tabindex="-1">معلومات المحادثة</h3><div id="conversationInfoContent" aria-live="polite">جارٍ تحميل المعلومات...</div><div class="infoActions"><button id="friendAction" type="button">إضافة إلى الأصدقاء</button><button id="blockAction" class="secondary" type="button">حظر المستخدم</button><button id="reportAction" class="secondary" type="button">الإبلاغ عن المستخدم</button></div><p id="conversationActionStatus" role="status" aria-live="polite"></p></section><div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
<div id="composePanel"><h2>إرسال رسالة</h2><form id="sendForm" aria-label="إرسال رسالة"><label for="messageText">اكتب رسالتك</label><textarea id="messageText" rows="3" maxlength="4000" required autocomplete="off" placeholder="اكتب رسالتك هنا..." aria-describedby="messageHint" disabled></textarea><p id="messageHint" class="muted">اكتب رسالتك هنا. الحد الأقصى 4000 حرف.</p><button id="sendButton" type="submit" disabled>إرسال الرسالة</button></form></div></section>
<p id="status" role="status" aria-live="polite">جارٍ التحقق من الحساب...</p>
</main>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
const cfg={apiKey:"AIzaSyDQZpAJgNCqd4iXyJyN9zFC-8LneS_UWQs",authDomain:"tareeq-al-layl.firebaseapp.com",projectId:"tareeq-al-layl",storageBucket:"tareeq-al-layl.firebasestorage.app",messagingSenderId:"1071185437335",appId:"1:1071185437335:web:4ca6e3f87152f9ef68ffd2"};
const auth=getAuth(initializeApp(cfg));const status=document.getElementById("status"),list=document.getElementById("conversationList"),panel=document.getElementById("chatPanel"),messages=document.getElementById("messages");
let socket=null,currentId=null,currentOtherUid=null,currentOtherName="مستخدم",known=new Set(),currentDetails=null,messageActionId=0;
function say(t){status.textContent=t}

// صوتان قصيران مختلفان للإرسال والاستقبال باستخدام Web Audio، دون ملفات خارجية.
let audioContext=null;
function unlockMessageAudio(){
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return;
  if(!audioContext)audioContext=new AudioContextClass();
  if(audioContext.state==="suspended")audioContext.resume().catch(()=>{});
}
document.addEventListener("pointerdown",unlockMessageAudio,{once:true});
document.addEventListener("keydown",unlockMessageAudio,{once:true});
document.addEventListener("click",unlockMessageAudio,{once:true});
function playMessageSound(kind){
  if(!audioContext||audioContext.state!=="running")return;
  const now=audioContext.currentTime;
  const notes=kind==="sent"?[660,880]:[880,523];
  notes.forEach((frequency,index)=>{
    const start=now+index*0.13;
    const oscillator=audioContext.createOscillator();
    const gain=audioContext.createGain();
    oscillator.type="sine";
    oscillator.frequency.setValueAtTime(frequency,start);
    gain.gain.setValueAtTime(0.0001,start);
    gain.gain.exponentialRampToValueAtTime(0.12,start+0.025);
    gain.gain.exponentialRampToValueAtTime(0.0001,start+0.11);
    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start(start);
    oscillator.stop(start+0.12);
  });
}

function call(event,data={},timeoutMs=12000){return new Promise(resolve=>{const activeSocket=socket;if(!activeSocket||!activeSocket.connected){resolve({success:false,connectionLost:true});return}let settled=false;const finish=result=>{if(settled)return;settled=true;clearTimeout(timer);activeSocket.off("disconnect",onDisconnect);resolve(result)};const onDisconnect=()=>finish({success:false,connectionLost:true});const timer=setTimeout(()=>finish(activeSocket.connected?{success:false,message:"تأخر رد الخادم أثناء تنفيذ الطلب: "+event+". تحقق من الاتصال وحاول مرة أخرى."}:{success:false,connectionLost:true}),timeoutMs);activeSocket.once("disconnect",onDisconnect);activeSocket.emit(event,data,result=>{if(event==="listConversations")activeSocket.emit("clientAckReceived",{event,success:!!result?.success});finish(result||{success:false,message:"لم يصل رد من الخادم."})})})}
function addMessage(m){
  if(known.has(m.id))return;
  known.add(m.id);
  const div=document.createElement("div");
  div.className="msg"+(m.senderUid===auth.currentUser?.uid?" mine":"");
  div.dataset.messageId=m.id;
  const who=m.senderUid===auth.currentUser?.uid?"أنت":(m.senderName||currentOtherName||"مستخدم");
  const content=document.createElement("p");
  content.className="messageContent";
  content.textContent=who+": "+m.text+(m.edited?" (تم التعديل)":"");
  // اجعل الرسالة نفسها عنصرًا قابلًا للتعديل لدى VoiceOver؛ لا يحتاج المستخدم إلى الانتقال إلى عنصر منفصل.
  div.append(content);
  const actions=document.createElement("div");
  actions.className="messageActions";actions.hidden=true;
  const currentUid=String(auth.currentUser?.uid||"");
  const senderUid=String(m.senderUid||"");
  const mine=!!currentUid&&!!senderUid&&senderUid===currentUid;
  const optionsButton=document.createElement("button");
  optionsButton.type="button";optionsButton.className="messageOptionsButton";
  optionsButton.textContent="خيارات الرسالة";
  optionsButton.setAttribute("aria-expanded","false");
  optionsButton.addEventListener("click",()=>{
    actions.hidden=!actions.hidden;
    optionsButton.setAttribute("aria-expanded",String(!actions.hidden));
    if(!actions.hidden){
      const firstAction=actions.querySelector(mine?'[data-action="delete-everyone"]':'[data-action="delete-me"]');
      firstAction?.focus();
    }
  });
  div.append(optionsButton);
  if(mine){
    const edit=document.createElement("button");
    edit.type="button";edit.dataset.action="edit-message";
    edit.textContent="تعديل الرسالة";
    edit.setAttribute("aria-label","تعديل رسالتك");
    edit.addEventListener("click",()=>showMessageEditor(m,div,content,actions,optionsButton));
    actions.append(edit);
    const everyone=document.createElement("button");
    everyone.type="button";everyone.dataset.action="delete-everyone";
    everyone.id="message-delete-all-"+(++messageActionId);
    everyone.textContent="حذف لدى الجميع";
    everyone.setAttribute("aria-label","حذف الرسالة لدى الجميع");
    everyone.addEventListener("click",()=>deleteMessageForEveryone(m.id,div));
    actions.append(everyone);
  }
  const own=document.createElement("button");
  own.type="button";own.dataset.action="delete-me";
  own.id="message-delete-me-"+(++messageActionId);own.textContent="حذف لدي";
  own.setAttribute("aria-label","حذف الرسالة لدي فقط");
  own.addEventListener("click",()=>deleteMessageForMe(m.id,div));
  actions.append(own);
  div.append(actions);
  let touchStartX=null,touchStartY=null;
  div.addEventListener("touchstart",e=>{if(e.touches.length===1){touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY}},{passive:true});
  div.addEventListener("touchend",e=>{
    if(touchStartX===null||!e.changedTouches.length)return;
    const dx=e.changedTouches[0].clientX-touchStartX;
    const dy=e.changedTouches[0].clientY-touchStartY;
    if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.3){
      actions.hidden=false;
      actions.querySelector("button")?.focus();
    }
    touchStartX=null;touchStartY=null;
  },{passive:true});
  messages.append(div);messages.scrollTop=messages.scrollHeight;
}
function showMessageEditor(message,element,content,actions,optionsButton){
  if(element.querySelector(".messageEditForm"))return;
  actions.hidden=true;
  optionsButton.setAttribute("aria-expanded","false");
  const form=document.createElement("form");
  form.className="messageEditForm";
  const label=document.createElement("label");
  const field=document.createElement("textarea");
  const fieldId="edit-message-"+(++messageActionId);
  label.htmlFor=fieldId;label.textContent="عدّل نص الرسالة";
  field.id=fieldId;field.maxLength=4000;field.required=true;field.value=message.text||"";
  field.setAttribute("aria-label","نص الرسالة بعد التعديل");
  const save=document.createElement("button");save.type="submit";save.textContent="حفظ التعديل";
  const cancel=document.createElement("button");cancel.type="button";cancel.className="secondary";cancel.textContent="إلغاء التعديل";
  cancel.addEventListener("click",()=>{form.remove();optionsButton.focus()});
  form.append(label,field,save,cancel);
  element.append(form);field.focus();
  form.addEventListener("submit",async event=>{
    event.preventDefault();
    const updatedText=field.value.trim();
    if(!updatedText){field.setCustomValidity("اكتب نص الرسالة.");field.reportValidity();return}
    if(updatedText===message.text){form.remove();optionsButton.focus();return}
    save.disabled=true;cancel.disabled=true;
    const result=await call("editDirectMessage",{conversationId:currentId,messageId:message.id,text:updatedText});
    save.disabled=false;cancel.disabled=false;
    if(!result.success){say(result.message||"تعذر تعديل الرسالة.");return}
    message.text=updatedText;
    message.edited=true;
    content.textContent="أنت: "+updatedText+" (تم التعديل)";
    form.remove();
    await loadConversations();
    optionsButton.focus();
  });
}
async function deleteMessageForMe(id,element){
  if(!confirm("هل أنت متأكد من حذف هذه الرسالة لديك فقط؟ لن تُحذف من جهاز الطرف الآخر."))return;
  const buttons=element.querySelectorAll("button");buttons.forEach(b=>b.disabled=true);
  const r=await call("deleteDirectMessageForMe",{conversationId:currentId,messageId:id});
  buttons.forEach(b=>b.disabled=false);
  if(!r.success){say(r.message||"تعذر حذف الرسالة.");return}
  known.delete(id);element.remove();say("تم حذف الرسالة لديك فقط.");
}
async function deleteMessageForEveryone(id,element){
  if(!confirm("تنبيه: هل أنت متأكد من حذف هذه الرسالة لدى الجميع؟ ستُحذف من المحادثة عندك وعند الطرف الآخر."))return;
  const buttons=element.querySelectorAll("button");buttons.forEach(b=>b.disabled=true);
  const r=await call("deleteDirectMessageForEveryone",{conversationId:currentId,messageId:id});
  buttons.forEach(b=>b.disabled=false);
  if(!r.success){say(r.message||"تعذر حذف الرسالة لدى الجميع.");return}
  known.delete(id);element.remove();say("تم حذف الرسالة لدى الجميع.");
}
async function openConversation(c){currentId=c.id;currentOtherUid=c.otherUid||null;currentOtherName=c.displayName||c.email||"مستخدم";currentDetails=null;known.clear();messages.replaceChildren();document.getElementById("conversationListPanel").hidden=true;document.getElementById("mainNavigation").hidden=true;document.body.classList.add("chat-open");panel.style.display="block";document.getElementById("conversationInfo").hidden=true;document.getElementById("messages").hidden=false;document.getElementById("composePanel").hidden=false;document.getElementById("conversationInfoButton").setAttribute("aria-expanded","false");document.getElementById("messageText").disabled=false;document.getElementById("sendButton").disabled=false;document.getElementById("messageHint").textContent="يمكنك كتابة رسالة تصل إلى 4000 حرف.";document.getElementById("chatTitle").textContent="محادثة مع "+(c.displayName||c.email||"مستخدم");const r=await call("getConversationMessages",{conversationId:c.id});if(!r.success){say(r.message);return}r.messages.forEach(addMessage);refreshConversationInfo();document.getElementById("messageText").focus()}
async function loadConversations(){const requestSocket=socket;const r=await call("listConversations",{},30000);if(r.connectionLost||requestSocket!==socket||!socket?.connected)return;if(!r.success){list.textContent=r.message;return}list.replaceChildren();if(!r.conversations.length){list.textContent="لا توجد محادثات بعد. ابحث عن اسم شخص لبدء محادثة.";return}r.conversations.forEach(c=>{const b=document.createElement("button");b.className="conversation";const preview=String(c.lastMessage||"").replace(/\s*\(تم التعديل\)\s*$/,"").replace(/^تم التعديل\.?$/,"");b.textContent=(c.displayName||c.email||"مستخدم")+"، "+(preview||"ابدأ المحادثة");b.addEventListener("click",()=>openConversation(c));list.append(b)})}
async function startChatWithUser(user){say("جارٍ فتح المحادثة...");const started=await call("startDirectConversation",{targetUid:user.uid});if(!started.success){say(started.message);return}openConversation({...started.conversation,otherUid:user.uid});loadConversations()}
let onlineUsers=[];
const onlinePanel=document.getElementById("onlinePanel"),onlineList=document.getElementById("onlineList"),onlineSearch=document.getElementById("onlineSearch");
function renderOnlineUsers(){const term=onlineSearch.value.trim().toLocaleLowerCase("ar");onlineList.replaceChildren();const matches=onlineUsers.filter(user=>String(user.name||"").toLocaleLowerCase("ar").includes(term));if(!matches.length){onlineList.textContent=term?"لا يوجد شخص متصل بهذا الاسم.":"لا يوجد أشخاص آخرون متصلون حاليًا.";return}matches.forEach(user=>{const b=document.createElement("button");b.type="button";b.className="conversation";b.textContent=user.uid===auth.currentUser?.uid?user.name+"، أنت، متصل الآن":user.name+"، متصل الآن";if(user.uid===auth.currentUser?.uid){b.disabled=true;b.setAttribute("aria-label",user.name+"، هذا حسابك، متصل الآن");}else b.addEventListener("click",()=>startChatWithUser(user));onlineList.append(b)})}
document.getElementById("openOnline").addEventListener("click",()=>{const opening=onlinePanel.hidden;onlinePanel.hidden=!opening;document.getElementById("openOnline").setAttribute("aria-expanded",String(opening));if(opening){onlineSearch.focus();if(!socket||!socket.connected){onlineList.textContent="الاتصال بالخادم غير متاح حاليًا. أعد المحاولة بعد قليل.";return}renderOnlineUsers()}});
onlineSearch.addEventListener("input",renderOnlineUsers);
document.getElementById("closeChat").addEventListener("click",()=>{currentId=null;currentOtherUid=null;currentOtherName="مستخدم";currentDetails=null;panel.style.display="none";document.getElementById("mainNavigation").hidden=false;document.body.classList.remove("chat-open");document.getElementById("conversationListPanel").hidden=false;document.getElementById("conversationInfo").hidden=true;document.getElementById("messages").hidden=false;document.getElementById("composePanel").hidden=false;document.getElementById("conversationInfoButton").setAttribute("aria-expanded","false");messages.replaceChildren();known.clear();document.getElementById("messageText").value="";document.getElementById("messageText").disabled=true;document.getElementById("sendButton").disabled=true;document.getElementById("conversationHeading").focus()});
function formatInfoDate(timestamp){if(!timestamp)return "غير متوفر";return new Intl.DateTimeFormat("ar-JO",{dateStyle:"medium",timeStyle:"short"}).format(new Date(timestamp))}
async function refreshConversationInfo(){
  const content=document.getElementById("conversationInfoContent"),statusBox=document.getElementById("conversationActionStatus");
  if(!currentId)return;
  content.textContent="جارٍ تحميل معلومات المحادثة...";
  const r=await call("getConversationDetails",{conversationId:currentId});
  if(!r.success){content.textContent=r.message||"تعذر تحميل المعلومات.";return}
  currentDetails=r.details;currentOtherUid=r.details.uid;
  const d=r.details;
  content.replaceChildren();
  const rows=[
    ["اسم المستخدم",d.name],
    ["حالة الاتصال",d.online?"متصل الآن":"غير متصل"],
    ["حالة الصداقة",d.isFriend?"ضمن قائمة أصدقائك":d.pendingRequest?"طلب الصداقة مُرسل وبانتظار الرد": "ليس ضمن قائمة أصدقائك"],
    ["عدد الرسائل",String(d.messageCount)],
    ["تاريخ آخر نشاط",formatInfoDate(d.updatedAt)],
    ["بداية المحادثة",formatInfoDate(d.createdAt)]
  ];
  rows.forEach(([label,value])=>{const row=document.createElement("p");row.className="infoMeta";row.textContent=label+": "+value;content.append(row)});
  const blockNote=document.createElement("p");
  blockNote.className="infoMeta";
  blockNote.textContent=d.blockedByMe?"حالة الحظر: قمت بحظر هذا المستخدم.":d.blockedMe?"حالة الحظر: هذا المستخدم قام بحظرك.":"حالة الحظر: لا يوجد حظر بينكما.";
  content.append(blockNote);
  const friendButton=document.getElementById("friendAction");
  friendButton.hidden=d.isFriend;
  friendButton.textContent=d.pendingRequest?"إلغاء طلب الصداقة":"إرسال طلب صداقة";
  const blockButton=document.getElementById("blockAction");
  blockButton.hidden=d.blockedMe&&!d.blockedByMe;
  blockButton.textContent=d.blockedByMe?"إلغاء الحظر":"حظر المستخدم";
  const blocked=d.blockedByMe||d.blockedMe;
  document.getElementById("messageText").disabled=blocked;
  document.getElementById("sendButton").disabled=blocked;
  document.getElementById("messageHint").textContent=blocked?"إرسال الرسائل متوقف بسبب إعدادات الحظر.":"يمكنك كتابة رسالة تصل إلى 4000 حرف.";
  statusBox.textContent="";
}
document.getElementById("conversationInfoButton").addEventListener("click",async()=>{
  const info=document.getElementById("conversationInfo"),opening=info.hidden;
  info.hidden=!opening;
  document.getElementById("messages").hidden=opening;
  document.getElementById("composePanel").hidden=opening;
  document.getElementById("conversationInfoButton").setAttribute("aria-expanded",String(opening));
  if(opening){await refreshConversationInfo();document.getElementById("conversationInfoHeading").focus()}
  else document.getElementById("messageText").focus()
});
document.getElementById("friendAction").addEventListener("click",async()=>{
  if(!currentOtherUid)return;
  const b=document.getElementById("friendAction"),statusBox=document.getElementById("conversationActionStatus");
  b.disabled=true;const cancel=currentDetails?.pendingRequest===true;const r=await call(cancel?"cancelFriendRequest":"sendFriendRequest",cancel?{targetUid:currentOtherUid}:{targetUid:currentOtherUid});b.disabled=false;
  statusBox.textContent=r.message|| (r.success?(cancel?"تم إلغاء طلب الصداقة.":"تم إرسال طلب الصداقة."):"تعذر تنفيذ الطلب.");
  if(r.success)await refreshConversationInfo();
});
document.getElementById("blockAction").addEventListener("click",async()=>{
  if(!currentOtherUid||!currentId||!currentDetails)return;
  const blocking=!currentDetails.blockedByMe;
  const confirmText=blocking?"هل تريد حظر هذا المستخدم؟ لن تتمكنوا من تبادل رسائل جديدة.":"هل تريد إلغاء حظر هذا المستخدم؟";
  if(!confirm(confirmText))return;
  const button=document.getElementById("blockAction"),statusBox=document.getElementById("conversationActionStatus");
  button.disabled=true;
  const r=await call(blocking?"blockConversationUser":"unblockConversationUser",{uid:currentOtherUid,conversationId:currentId});
  button.disabled=false;statusBox.textContent=r.message||(r.success?"تم تنفيذ الإجراء.":"تعذر تنفيذ الإجراء.");
  if(r.success)await refreshConversationInfo();
});
document.getElementById("reportAction").addEventListener("click",async()=>{
  if(!currentOtherUid||!currentId)return;
  const reason=prompt("ما سبب الإبلاغ؟ اكتب مثلًا: إساءة، تحرش، تهديد، انتحال شخصية، أو محتوى غير مناسب.");
  if(!reason||!reason.trim())return;
  const details=prompt("يمكنك إضافة تفاصيل تساعد في مراجعة البلاغ، أو ترك الحقل فارغًا.")||"";
  const button=document.getElementById("reportAction"),statusBox=document.getElementById("conversationActionStatus");
  button.disabled=true;const r=await call("reportConversationUser",{uid:currentOtherUid,conversationId:currentId,reason,details});button.disabled=false;
  statusBox.textContent=r.message||(r.success?"تم استلام البلاغ.":"تعذر إرسال البلاغ.");
});
document.getElementById("sendForm").addEventListener("submit",async e=>{e.preventDefault();const field=document.getElementById("messageText"),button=document.getElementById("sendButton"),text=field.value.trim();if(!currentId||!text)return;unlockMessageAudio();button.disabled=true;button.textContent="جارٍ الإرسال...";const r=await call("sendDirectMessage",{conversationId:currentId,text});button.disabled=false;button.textContent="إرسال الرسالة";if(!r.success){say(r.message);return}addMessage(r.message);field.value="";playMessageSound("sent");say("تم إرسال الرسالة بنجاح.")});

onAuthStateChanged(auth,async user=>{if(!user){location.replace("login.html");return}try{const token=await user.getIdToken();socket=io("https://tareeq-al-layl-server.onrender.com",{auth:{token},reconnection:true,reconnectionAttempts:Infinity,reconnectionDelay:1000,reconnectionDelayMax:5000});socket.on("connect",async()=>{say("أنت متصل بمِرسالو.");await loadConversations()});socket.on("disconnect",reason=>{say("انقطع الاتصال مؤقتًا، جارٍ إعادة الاتصال بمِرسالو.");});socket.on("connect_error",err=>say("تعذر الاتصال: "+(err.message||"خطأ غير معروف")));socket.on("onlinePlayers",users=>{onlineUsers=Array.isArray(users)?users:[];if(!onlinePanel.hidden)renderOnlineUsers()});socket.on("directMessageDeletedForEveryone",data=>{if(data?.conversationId===currentId){const element=messages.querySelector(`[data-message-id="${CSS.escape(data.messageId)}"]`);if(element){known.delete(data.messageId);element.remove()}say("تم حذف رسالة لدى الجميع.")}});socket.on("directMessageEdited",data=>{if(data?.conversationId===currentId){const element=messages.querySelector(`[data-message-id="${CSS.escape(data.messageId)}"]`);if(element){const content=element.querySelector(".messageContent");if(content){const who=element.classList.contains("mine")?"أنت":(currentOtherName||"مستخدم");content.textContent=who+": "+data.text+" (تم التعديل)";}}loadConversations();}});socket.on("directMessageReceived",data=>{if(data.message?.senderUid!==auth.currentUser?.uid)playMessageSound("received");if(data.conversationId===currentId)addMessage(data.message);loadConversations()})}catch(e){say("تعذر تهيئة الاتصال بالحساب.")}});
</script></body></html>
