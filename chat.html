<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>محادثات مِرسالو</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#101827;color:#f5f7fb}*{box-sizing:border-box}body{margin:0;line-height:1.7}header{padding:15px 20px;background:#1b293b;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;color:#8bd8c5;font-size:1.5rem}main{max-width:760px;margin:auto;padding:18px}.panel{background:#1b293b;border:1px solid #34445a;border-radius:16px;padding:17px;margin-bottom:16px}label{display:block;font-weight:bold;margin:12px 0 5px}input,textarea,button{font:inherit;width:100%;padding:12px;border-radius:10px;margin:5px 0}input,textarea{background:#fff;color:#111;border:2px solid #718096}button{background:#167c68;color:white;border:0;font-weight:bold}button:focus,input:focus,textarea:focus{outline:3px solid #ffd166;outline-offset:3px}.secondary{background:#42536b}.conversation{display:block;text-align:right;background:#26384e;margin:8px 0}.messages{min-height:150px;max-height:48vh;overflow:auto;padding:8px;background:#101827;border-radius:12px}.msg{padding:10px;margin:8px 0;border-radius:12px;background:#26384e;overflow-wrap:anywhere}.mine{background:#145b50}.muted{color:#c3d0df}.menuLink{display:block;padding:13px 14px;margin:6px 0;border-radius:10px;background:#26384e;color:#f5f7fb;text-decoration:none;font-weight:bold}.menuLink:focus{outline:3px solid #ffd166;outline-offset:3px}#sideMenu[hidden]{display:none}#chatPanel{display:none}#status{padding:10px;background:#26384e;border-radius:10px}
</style></head><body>
<header><h1>مِرسالو</h1><button id="menuToggle" class="secondary" type="button" aria-expanded="false" aria-controls="sideMenu" style="width:auto">القائمة</button></header>
<nav id="sideMenu" class="panel" aria-label="القائمة الرئيسية" hidden style="max-width:760px;margin:12px auto 0;padding:12px">
<a class="menuLink" href="profile.html">الملف الشخصي</a>
<a class="menuLink" href="settings.html">الإعدادات</a>
<a class="menuLink" href="index.html">حول مِرسالو</a>
<button id="logout" class="secondary" type="button">تسجيل الخروج</button>
</nav>
<main>
<section class="panel"><h2>ابدأ محادثة</h2><p class="muted">ابحث عن شخص باستخدام الاسم الذي اختاره عند إنشاء حسابه.</p>
<form id="findForm"><label for="personName">اسم المستخدم</label><input id="personName" type="text" autocomplete="off" required><button type="submit">البحث عن المستخدم</button></form><div id="searchResults" aria-live="polite"></div></section>
<section class="panel"><h2>محادثاتك</h2><div id="conversationList" aria-live="polite">جارٍ تحميل المحادثات...</div></section>
<section class="panel" id="chatPanel"><h2 id="chatTitle">المحادثة</h2><div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
<form id="sendForm"><label for="messageText">اكتب رسالتك</label><textarea id="messageText" rows="2" maxlength="4000" required></textarea><button type="submit">إرسال الرسالة</button></form></section>
<p id="status" role="status" aria-live="polite">جارٍ التحقق من الحساب...</p>
</main>
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
const cfg={apiKey:"AIzaSyDQZpAJgNCqd4iXyJyN9zFC-8LneS_UWQs",authDomain:"tareeq-al-layl.firebaseapp.com",projectId:"tareeq-al-layl",storageBucket:"tareeq-al-layl.firebasestorage.app",messagingSenderId:"1071185437335",appId:"1:1071185437335:web:4ca6e3f87152f9ef68ffd2"};
const auth=getAuth(initializeApp(cfg));const status=document.getElementById("status"),list=document.getElementById("conversationList"),panel=document.getElementById("chatPanel"),messages=document.getElementById("messages");
let socket=null,currentId=null,known=new Set();
function say(t){status.textContent=t}
const menu=document.getElementById("sideMenu"),menuToggle=document.getElementById("menuToggle");menuToggle.addEventListener("click",()=>{const opening=menu.hidden;menu.hidden=!opening;menuToggle.setAttribute("aria-expanded",String(opening));if(opening)menu.querySelector("a").focus()});
function call(event,data={}){return new Promise(resolve=>{if(!socket||!socket.connected){resolve({success:false,message:"الاتصال بالخادم غير متاح."});return}socket.emit(event,data,resolve)})}
function addMessage(m){if(known.has(m.id))return;known.add(m.id);const div=document.createElement("div");div.className="msg"+(m.senderUid===auth.currentUser?.uid?" mine":"");const who=m.senderUid===auth.currentUser?.uid?"أنت":"الطرف الآخر";div.textContent=who+": "+m.text;messages.append(div);messages.scrollTop=messages.scrollHeight}
async function openConversation(c){currentId=c.id;known.clear();messages.replaceChildren();panel.style.display="block";document.getElementById("chatTitle").textContent="محادثة مع "+(c.displayName||c.email||"مستخدم");const r=await call("getConversationMessages",{conversationId:c.id});if(!r.success){say(r.message);return}r.messages.forEach(addMessage);document.getElementById("messageText").focus()}
async function loadConversations(){const r=await call("listConversations");if(!r.success){list.textContent=r.message;return}list.replaceChildren();if(!r.conversations.length){list.textContent="لا توجد محادثات بعد. ابحث عن اسم شخص لبدء محادثة.";return}r.conversations.forEach(c=>{const b=document.createElement("button");b.className="conversation";b.textContent=(c.displayName||c.email||"مستخدم")+"، "+(c.lastMessage||"ابدأ المحادثة");b.addEventListener("click",()=>openConversation(c));list.append(b)})}
async function startChatWithUser(user){const started=await call("startDirectConversation",{targetUid:user.uid});if(!started.success){say(started.message);return}say("تم فتح المحادثة مع "+user.displayName+".");await loadConversations();openConversation(started.conversation)}
document.getElementById("findForm").addEventListener("submit",async e=>{e.preventDefault();const name=document.getElementById("personName").value.trim();const results=document.getElementById("searchResults");results.replaceChildren();say("جارٍ البحث عن الاسم...");const found=await call("findUserByName",{name});if(!found.success){say(found.message);return}if(found.users.length===1){await startChatWithUser(found.users[0]);return}say("وجدنا أكثر من شخص بهذا الاسم. اختر الشخص المطلوب.");found.users.forEach(user=>{const b=document.createElement("button");b.type="button";b.textContent=user.displayName;b.addEventListener("click",()=>startChatWithUser(user));results.append(b)})});
document.getElementById("sendForm").addEventListener("submit",async e=>{e.preventDefault();const field=document.getElementById("messageText"),text=field.value.trim();if(!currentId||!text)return;const r=await call("sendDirectMessage",{conversationId:currentId,text});if(!r.success){say(r.message);return}addMessage(r.message);field.value="";say("تم إرسال الرسالة.")});
document.getElementById("logout").addEventListener("click",async()=>{if(socket)socket.disconnect();await signOut(auth);location.replace("login.html")});
onAuthStateChanged(auth,async user=>{if(!user){location.replace("login.html");return}try{const token=await user.getIdToken();socket=io("https://tareeq-al-layl-server.onrender.com",{auth:{token},transports:["websocket","polling"]});socket.on("connect",async()=>{say("أنت متصل بمِرسالو.");await loadConversations()});socket.on("connect_error",err=>say("تعذر الاتصال: "+(err.message||"خطأ غير معروف")));socket.on("directMessageReceived",data=>{if(data.conversationId===currentId)addMessage(data.message);loadConversations()})}catch(e){say("تعذر تهيئة الاتصال بالحساب.")}});
</script></body></html>
