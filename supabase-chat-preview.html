<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827">
<title>معاينة محادثات مرسال</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#101827;color:#f5f7fb}
*{box-sizing:border-box}body{margin:0;padding:16px;line-height:1.8}
main{max-width:760px;margin:0 auto}
header,.panel{background:#1b293b;border:1px solid #34445a;border-radius:14px;padding:16px;margin-bottom:14px}
h1,h2{margin-top:0}h1{font-size:1.4rem;color:#8bd8c5}h2{font-size:1.1rem}
button,input,textarea{font:inherit;border-radius:9px;padding:11px}
button{border:0;background:#167c68;color:white;font-weight:bold;cursor:pointer;margin:4px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ffd166;outline-offset:3px}
input,textarea{width:100%;background:#0e1927;color:#fff;border:1px solid #53657b}
label{display:block;font-weight:bold;margin:8px 0}
ul{padding-right:22px}li{margin:8px 0}
.item{display:block;width:100%;text-align:right;background:#26384e}
#status{background:#26384e;padding:12px;border-radius:9px;min-height:48px}
#messages{max-height:45vh;overflow:auto}
.message{padding:10px;margin:8px 0;background:#26384e;border-radius:9px}
.message strong{display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header>
<h1>معاينة محادثات مرسال</h1>
<p>صفحة اختبار مستقلة لنظام Supabase الجديد. صفحة المحادثات الأساسية لا تزال على النظام القديم.</p>
<p id="status" role="status" aria-live="polite">جارٍ التحقق من الجلسة...</p>
<div class="actions">
<button id="refresh" type="button">تحديث المحادثات</button>
<button id="signout" type="button">تسجيل الخروج</button>
</div>
</header>

<section class="panel" aria-labelledby="searchTitle">
<h2 id="searchTitle">بدء محادثة</h2>
<form id="searchForm">
<label for="searchInput">ابحث عن مستخدم بالاسم</label>
<input id="searchInput" autocomplete="off" minlength="2" required>
<button type="submit">بحث</button>
</form>
<ul id="searchResults" aria-label="نتائج البحث"></ul>
</section>

<section class="panel" aria-labelledby="conversationsTitle">
<h2 id="conversationsTitle">محادثاتي</h2>
<ul id="conversationList"></ul>
</section>

<section class="panel" id="chatPanel" aria-labelledby="chatTitle" hidden>
<h2 id="chatTitle">الرسائل</h2>
<p id="conversationName"></p>
<ul id="messages" aria-label="رسائل المحادثة"></ul>
<form id="sendForm">
<label for="messageInput">اكتب رسالتك</label>
<textarea id="messageInput" rows="3" maxlength="4000"></textarea>
<label for="attachmentInput">إرفاق صورة أو ملف أو فيديو</label>
<input id="attachmentInput" type="file">
<button type="submit">إرسال</button>
</form>
</section>
</main>
<script type="module" src="./supabase-chat-preview.mjs"></script>
</body>
</html>
