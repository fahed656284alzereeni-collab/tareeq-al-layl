<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>الملف الشخصي - مِرسالو</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#101827;color:#f5f7fb}*{box-sizing:border-box}body{margin:0;line-height:1.8;padding:18px}main{max-width:560px;margin:24px auto;background:#1b293b;border:1px solid #34445a;border-radius:18px;padding:22px}h1{color:#8bd8c5;margin-top:0}label{display:block;font-weight:bold;margin:14px 0 5px}input,button,a{font:inherit}input[type=text]{width:100%;padding:12px;border-radius:10px;margin:5px 0;background:#fff;color:#111}button,.link{display:block;width:100%;padding:13px;border:0;border-radius:10px;margin:12px 0;background:#167c68;color:white;text-align:center;text-decoration:none;font-weight:bold}.secondary{background:#42536b}.danger{background:#9d3542}button:focus,input:focus,a:focus{outline:3px solid #ffd166;outline-offset:3px}#status{padding:12px;background:#26384e;border-radius:10px}#avatar{width:112px;height:112px;border-radius:50%;background:#30465d;color:#8bd8c5;display:flex;align-items:center;justify-content:center;margin:12px auto;font-size:42px;font-weight:bold}.muted{color:#c3d0df}.warning{color:#ffd7dc;background:#452a35;border-radius:10px;padding:12px}
</style></head><body><main>
<h1>الملف الشخصي</h1><p class="muted">يمكنك تعديل اسم المستخدم وإدارة حسابك.</p>
<div id="avatar" role="img" aria-label="صورة افتراضية لمِرسالو">م</div>
<p id="email" class="muted" aria-live="polite">جارٍ تحميل بيانات الحساب...</p>
<form id="profileForm"><label for="playerName">اسم المستخدم</label><input id="playerName" type="text" maxlength="30" minlength="2" required autocomplete="nickname"><button id="save" type="submit">حفظ الاسم</button></form>
<p class="warning">حذف الحساب نهائي ولا يمكن التراجع عنه. ستُحذف بيانات الحساب وقائمة الأصدقاء، لكن سجل المحادثات والرسائل سيبقى محفوظًا لدى الطرف الآخر.</p>
<button id="deleteAccount" class="danger" type="button">حذف الحساب نهائيًا</button>
<p id="status" role="status" aria-live="polite">جارٍ تحميل الملف الشخصي...</p><a class="link secondary" href="chat.html">العودة إلى المحادثات</a>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,onAuthStateChanged,updateProfile,signOut}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDQZpAJgNCqd4iXyJyN9zFC-8LneS_UWQs",authDomain:"tareeq-al-layl.firebaseapp.com",projectId:"tareeq-al-layl",storageBucket:"tareeq-al-layl.firebasestorage.app",messagingSenderId:"1071185437335",appId:"1:1071185437335:web:4ca6e3f87152f9ef68ffd2"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const form=document.getElementById("profileForm"),nameField=document.getElementById("playerName"),email=document.getElementById("email"),status=document.getElementById("status"),save=document.getElementById("save"),deleteAccount=document.getElementById("deleteAccount");
let activeUser=null;function say(message){status.textContent=message}
onAuthStateChanged(auth,async user=>{if(!user){location.replace("login.html");return}activeUser=user;try{const snap=await getDoc(doc(db,"users",user.uid));const data=snap.exists()?snap.data():{};nameField.value=data.playerName||user.displayName||"";email.textContent=user.email||"لا يوجد بريد إلكتروني";say("تم تحميل بيانات الحساب.")}catch(error){say("تعذر تحميل الملف الشخصي. رمز الخطأ: "+(error.code||"unknown"))}});
form.addEventListener("submit",async event=>{event.preventDefault();if(!activeUser)return;const playerName=nameField.value.trim();if(playerName.length<2){say("اسم المستخدم يجب أن يتكون من حرفين على الأقل.");nameField.focus();return}save.disabled=true;deleteAccount.disabled=true;try{await updateProfile(activeUser,{displayName:playerName});await setDoc(doc(db,"users",activeUser.uid),{uid:activeUser.uid,email:activeUser.email||"",displayName:playerName,playerName},{merge:true});say("تم حفظ اسم المستخدم بنجاح.")}catch(error){say("تعذر حفظ الاسم: "+(error.message||error.code||"خطأ غير معروف"))}finally{save.disabled=false;deleteAccount.disabled=false}});
deleteAccount.addEventListener("click",async()=>{if(!activeUser)return;const confirmed=confirm("تنبيه: حذف الحساب نهائي ولا يمكن التراجع عنه. ستُحذف بيانات حسابك وقائمة أصدقائك، لكن سجل المحادثات والرسائل سيبقى محفوظًا لدى الطرف الآخر. هل تريد المتابعة؟");if(!confirmed)return;const typed=prompt("للتأكيد، اكتب كلمة حذف");if(typed!=="حذف"){say("تم إلغاء حذف الحساب.");return}save.disabled=true;deleteAccount.disabled=true;say("جارٍ حذف الحساب. يرجى عدم إغلاق الصفحة...");try{const token=await activeUser.getIdToken(true);const response=await fetch("https://tareeq-al-layl-server.onrender.com/api/delete-account",{method:"POST",headers:{Authorization:"Bearer "+token}});const result=await response.json().catch(()=>({}));if(!response.ok||!result.success)throw new Error(result.message||"تعذر حذف الحساب. حاول مرة أخرى.");await signOut(auth);location.replace("login.html")}catch(error){say("لم يكتمل حذف الحساب: "+(error.message||"خطأ غير معروف"));save.disabled=false;deleteAccount.disabled=false}});
</script></body></html>
