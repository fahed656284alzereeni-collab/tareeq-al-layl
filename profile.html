<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>الملف الشخصي - مِرسالو</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#101827;color:#f5f7fb}*{box-sizing:border-box}body{margin:0;line-height:1.8;padding:18px}main{max-width:560px;margin:24px auto;background:#1b293b;border:1px solid #34445a;border-radius:18px;padding:22px}h1{color:#8bd8c5;margin-top:0}label{display:block;font-weight:bold;margin:14px 0 5px}input,button,a{font:inherit}input[type=text]{width:100%;padding:12px;border-radius:10px;margin:5px 0;background:#fff;color:#111}button,.link{display:block;width:100%;padding:13px;border:0;border-radius:10px;margin:12px 0;background:#167c68;color:white;text-align:center;text-decoration:none;font-weight:bold}.secondary{background:#42536b}button:focus,input:focus{outline:3px solid #ffd166;outline-offset:3px}#status{padding:12px;background:#26384e;border-radius:10px}#avatar{width:112px;height:112px;border-radius:50%;background:#30465d;color:#8bd8c5;display:flex;align-items:center;justify-content:center;margin:12px auto;font-size:42px;font-weight:bold}.muted{color:#c3d0df}
</style><link rel="stylesheet" href="/mersalo-theme.css?v=20261104">

<script>
/* Keep the visual design, while making spoken controls concise and headings plain text. */
(()=>{
 const headingSelector="h1,h2,h3,h4,h5,h6";
 const landmarkSelector="nav,main,header,footer,aside,[role=\"navigation\"],[role=\"main\"],[role=\"banner\"],[role=\"contentinfo\"]";
 const copyStyle=["display","font-size","font-family","font-weight","font-style","line-height","color","text-align","letter-spacing","text-transform","margin-top","margin-right","margin-bottom","margin-left","align-self"];
 const plainHeading=el=>{
  if(!el.matches?.(headingSelector))return el;
  const style=getComputedStyle(el);
  const replacement=document.createElement("div");
  for(const attr of [...el.attributes])if(attr.name!=="role"&&attr.name!=="aria-level")replacement.setAttribute(attr.name,attr.value);
  for(const prop of copyStyle)replacement.style.setProperty(prop,style.getPropertyValue(prop));
  while(el.firstChild)replacement.append(el.firstChild);
  el.replaceWith(replacement);
  return replacement;
 };
 const normalizeButton=el=>{
  if(el.tagName!=="BUTTON")return;
  const name=(el.innerText||el.textContent||"").replace(/\s+/g," ").trim();
  if(name)el.setAttribute("aria-label",name);
 };
 const apply=root=>{
  if(root.nodeType!==1)return;
  if(root.matches?.(headingSelector))root=plainHeading(root);
  if(root.matches?.(landmarkSelector))root.setAttribute("role","presentation");
  if(root.matches?.("button"))normalizeButton(root);
  root.querySelectorAll?.(headingSelector).forEach(plainHeading);
  root.querySelectorAll?.(landmarkSelector).forEach(el=>el.setAttribute("role","presentation"));
  root.querySelectorAll?.("button").forEach(normalizeButton);
 };
 const start=()=>{
  apply(document.documentElement);
  new MutationObserver(records=>records.forEach(record=>{
   if(record.type==="characterData")apply(record.target.parentElement);
   else record.addedNodes.forEach(apply);
  })).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
 };
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start,{once:true});
 else start();
})();
</script>
</head><body><main>
<button class="link secondary" type="button" data-navigate="settings.html">رجوع إلى الإعدادات</button>
<h1 role="presentation">الملف الشخصي</h1><p class="muted">يمكنك تعديل اسم المستخدم وإدارة حسابك.</p>
<div id="avatar" role="img" aria-label="صورة افتراضية لمِرسالو">م</div>
<p id="email" class="muted" aria-live="polite"></p>
<form id="profileForm" novalidate><label for="playerName">اسم المستخدم</label><input id="playerName" type="text" maxlength="30" minlength="2" autocomplete="nickname"><label for="profileBio">نبذة شخصية (حتى 200 حرف)</label><textarea id="profileBio" maxlength="200" rows="4" aria-describedby="bioCount" placeholder="اكتب نبذة قصيرة عن نفسك"></textarea><p id="bioCount" class="muted" aria-live="polite">0 من 200 حرف</p><button id="save" type="submit">حفظ التغييرات</button></form>
<p id="status" role="status" aria-live="polite"></p>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,onAuthStateChanged,updateProfile}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,query,where,limit,getDocs,collection}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDQZpAJgNCqd4iXyJyN9zFC-8LneS_UWQs",authDomain:"tareeq-al-layl.firebaseapp.com",projectId:"tareeq-al-layl",storageBucket:"tareeq-al-layl.firebasestorage.app",messagingSenderId:"1071185437335",appId:"1:1071185437335:web:4ca6e3f87152f9ef68ffd2"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const apiBase="https://tareeq-al-layl-server.onrender.com";
const form=document.getElementById("profileForm"),nameField=document.getElementById("playerName"),bioField=document.getElementById("profileBio"),bioCount=document.getElementById("bioCount"),email=document.getElementById("email"),status=document.getElementById("status"),save=document.getElementById("save");
bioField.addEventListener("input",()=>{bioCount.textContent=bioField.value.length+" من 200 حرف"});
let activeUser=null;function say(message){status.textContent=message}
const inappropriateNameTerms=["كس","شرموط","شرموطة","قحبة","منيوك","منيوكة","خول","طيز","زب","متناك","عاهرة","fuck","fucker","motherfucker","shithead","bitch","cunt","nigger","faggot","whore","slut","rape","puta","puto","mierda","joder","caralho","viado","putain","merde","salope","connard","encule","arschloch","scheisse","hure","schlampe","блядь","сука","хуй","пизда","ебать","мудак","orospu","siktir","amk","vaffanculo","stronzo","troia","puttana","gaand","chutiya","bhenchod","madarchod","haramzada"];
function normalizeName(value){return String(value||"").normalize("NFKD").replace(/[\\u0300-\\u036f\\u064b-\\u065f\\u0670\\u06d6-\\u06ed]/g,"").toLocaleLowerCase().replace(/[0@]/g,"o").replace(/[1!|]/g,"i").replace(/[3]/g,"e").replace(/[4@]/g,"a").replace(/[5$]/g,"s").replace(/[7]/g,"t").replace(/[\\s._*\\-]+/g,"")}
function hasInappropriateName(value){const normalized=normalizeName(value);return inappropriateNameTerms.some(term=>normalized.includes(normalizeName(term)))}
let profileReady=false;
(async()=>{
 try{
  await auth.authStateReady();
  const user=auth.currentUser;
  if(!user){location.replace("login.html");return;}
  activeUser=user;
  const snap=await getDoc(doc(db,"users",user.uid));
  const data=snap.exists()?snap.data():{};
  const savedName=String(data.playerName||data.displayName||user.displayName||"").trim();
  nameField.value=savedName;
  bioField.value=String(data.bio||"").slice(0,200);
  bioCount.textContent=bioField.value.length+" من 200 حرف";
  email.textContent=user.email||"لا يوجد بريد إلكتروني";
  say(savedName?"تم تحميل بيانات الحساب.":"لا يوجد اسم محفوظ في سجل الحساب.");
 }catch(error){
  email.textContent=auth.currentUser?.email||"لا يوجد بريد إلكتروني";
  say("تعذر تحميل الملف الشخصي. رمز الخطأ: "+(error.code||"unknown"));
  console.error("Original profile load failed:",error?.code||error?.message||"unknown");
 }finally{
  profileReady=true;
 }
})();
form.addEventListener("submit",async event=>{event.preventDefault();if(!activeUser)return;let playerName=nameField.value.trim();const bio=bioField.value.trim();if(!playerName){try{const token=await activeUser.getIdToken();const response=await fetch(apiBase+"/api/profile/me",{headers:{Authorization:"Bearer "+token},cache:"no-store"});const result=await response.json().catch(()=>({}));playerName=String(result.playerName||result.displayName||result.username||result.name||activeUser.displayName||"").trim();if(playerName)nameField.value=playerName;}catch(error){playerName=String(activeUser.displayName||"").trim();if(playerName)nameField.value=playerName;}}if(playerName.length<2||playerName.length>30){say("اسم المستخدم يجب أن يكون بين حرفين و30 حرفًا.");nameField.focus();return}if(hasInappropriateName(playerName)){say("هذا الاسم قد يحتوي على لفظ مسيء أو غير لائق. يرجى اختيار اسم آخر.");nameField.focus();return}if(bio.length>200){say("النبذة الشخصية لا يمكن أن تتجاوز 200 حرف.");bioField.focus();return}save.disabled=true;say("جارٍ حفظ بيانات الحساب...");try{const token=await activeUser.getIdToken(true);const response=await fetch(apiBase+"/api/profile/me",{method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({playerName,bio}),cache:"no-store"});const result=await response.json().catch(()=>({}));if(!response.ok||!result.success)throw new Error(result.message||"تعذر حفظ الملف الشخصي.");await activeUser.reload();nameField.value=result.playerName||playerName;bioField.value=result.bio??bio;bioCount.textContent=bioField.value.length+" من 200 حرف";say("تم حفظ الاسم والنبذة الشخصية بنجاح.")}catch(error){say("تعذر حفظ بيانات الحساب: "+(error.message||error.code||"خطأ غير معروف"))}finally{save.disabled=false}});
</script><script>document.addEventListener("click",function(event){const button=event.target.closest("button[data-navigate]");if(button){location.href=button.dataset.navigate;}});</script><script src="diagnostics.js" defer></script><script>
(function(){
 function stopCheckboxParentClick(event){
  const target=event.target;
  if(target && target.closest && target.closest('input[type="checkbox"]')) event.stopPropagation();
 }
 document.addEventListener('click',stopCheckboxParentClick,true);
 document.addEventListener('change',stopCheckboxParentClick,true);
})();
</script>
<script>
/* Keep heading appearance while preventing screen readers from announcing heading levels. */
(()=>{const apply=root=>{if(root.matches?.("h1,h2,h3,h4,h5,h6"))root.setAttribute("role","presentation");root.querySelectorAll?.("h1,h2,h3,h4,h5,h6").forEach(el=>el.setAttribute("role","presentation"));};apply(document);new MutationObserver(records=>records.forEach(record=>record.addedNodes.forEach(node=>{if(node.nodeType===1)apply(node);}))).observe(document.documentElement,{childList:true,subtree:true});})();
</script>
