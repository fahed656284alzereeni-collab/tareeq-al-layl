<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>الملف الشخصي - مِرسالو</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#101827;color:#f5f7fb}*{box-sizing:border-box}body{margin:0;line-height:1.8;padding:18px}main{max-width:560px;margin:24px auto;background:#1b293b;border:1px solid #34445a;border-radius:18px;padding:22px}h1{color:#8bd8c5;margin-top:0}label{display:block;font-weight:bold;margin:14px 0 5px}input,button,a{font:inherit}input[type=text],textarea{display:block;width:100%;padding:12px;border:1px solid #718096;border-radius:10px;margin:5px 0;background:#fff;color:#111;font:inherit;line-height:1.6}textarea{resize:vertical;min-height:110px}input[type=text]:focus,textarea:focus,button:focus,a:focus{outline:3px solid #ffd166;outline-offset:3px}button,.link{display:block;width:100%;padding:13px;border:0;border-radius:10px;margin:12px 0;background:#167c68;color:white;text-align:center;text-decoration:none;font-weight:bold}.secondary{background:#42536b}#status{padding:12px;background:#26384e;border-radius:10px}#avatar{width:112px;height:112px;border-radius:50%;background:#30465d;color:#8bd8c5;display:flex;align-items:center;justify-content:center;margin:12px auto;font-size:42px;font-weight:bold}.muted{color:#c3d0df}
</style><link rel="stylesheet" href="/mersalo-theme.css?v=20261104">


</head><body><main role="presentation">
<button class="link secondary" type="button" data-navigate="settings.html">رجوع إلى الإعدادات</button>
<h1 role="presentation">الملف الشخصي</h1><p class="muted">يمكنك تعديل اسم المستخدم وإدارة حسابك.</p>
<div id="avatar" role="img" aria-label="صورة افتراضية لمِرسالو">م</div>
<p id="email" class="muted" aria-live="polite"></p>
<form id="profileForm" novalidate><label for="playerName">اسم المستخدم</label><input id="playerName" type="text" maxlength="30" minlength="2" autocomplete="nickname" aria-describedby="nameHelp" required><p id="nameHelp" class="muted">من حرفين إلى 30 حرفًا.</p><label for="profileBio">نبذة شخصية (حتى 200 حرف)</label><textarea id="profileBio" maxlength="200" rows="4" aria-describedby="bioCount" placeholder="اكتب نبذة قصيرة عن نفسك"></textarea><p id="bioCount" class="muted" aria-live="polite">0 من 200 حرف</p><button id="save" type="submit" disabled>حفظ التغييرات</button></form>
<p id="status" role="status" aria-live="polite"></p>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,onAuthStateChanged,updateProfile}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,query,where,limit,getDocs,collection}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDQZpAJgNCqd4iXyJyN9zFC-8LneS_UWQs",authDomain:"tareeq-al-layl.firebaseapp.com",projectId:"tareeq-al-layl",storageBucket:"tareeq-al-layl.firebasestorage.app",messagingSenderId:"1071185437335",appId:"1:1071185437335:web:4ca6e3f87152f9ef68ffd2"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const apiBase="https://tareeq-al-layl-server.onrender.com";
const form=document.getElementById("profileForm"),nameField=document.getElementById("playerName"),bioField=document.getElementById("profileBio"),bioCount=document.getElementById("bioCount"),email=document.getElementById("email"),status=document.getElementById("status"),save=document.getElementById("save");
bioField.addEventListener("input",()=>{bioCount.textContent=bioField.value.length+" من 200 حرف"});
let activeUser=null;let originalPlayerName="";let originalBio="";let nameWasEdited=false;let bioWasEdited=false;function say(message){status.textContent=message}
nameField.addEventListener("input",()=>{nameWasEdited=nameField.value.trim()!==originalPlayerName;});
bioField.addEventListener("input",()=>{bioWasEdited=bioField.value.trim()!==originalBio;});
const inappropriateNameTerms=["كس","شرموط","شرموطة","قحبة","منيوك","منيوكة","خول","طيز","زب","متناك","عاهرة","fuck","fucker","motherfucker","shithead","bitch","cunt","nigger","faggot","whore","slut","rape","puta","puto","mierda","joder","caralho","viado","putain","merde","salope","connard","encule","arschloch","scheisse","hure","schlampe","блядь","сука","хуй","пизда","ебать","мудак","orospu","siktir","amk","vaffanculo","stronzo","troia","puttana","gaand","chutiya","bhenchod","madarchod","haramzada"];
function normalizeName(value){return String(value||"").normalize("NFKD").replace(/[\u0300-\u036f\u064b-\u065f\u0670\u06d6-\u06ed]/g,"").toLocaleLowerCase().replace(/[0@]/g,"o").replace(/[1!|]/g,"i").replace(/3/g,"e").replace(/4/g,"a").replace(/[5$]/g,"s").replace(/7/g,"t").replace(/[\s._*\-]+/g,"")}
function hasInappropriateName(value){const normalized=normalizeName(value);return inappropriateNameTerms.some(term=>normalized.includes(normalizeName(term)))}
let profileReady=false;
save.disabled=true;
(async()=>{
 try{
  await auth.authStateReady();
  const user=auth.currentUser;
  if(!user){location.replace("login.html");return;}
  activeUser=user;
  // The server profile endpoint is the canonical source: it reconciles Firestore
  // fields and the verified Google account name before returning the profile.
  const token=await user.getIdToken();
  const response=await fetch(apiBase+"/api/profile/me",{headers:{Authorization:"Bearer "+token},cache:"no-store"});
  const result=await response.json().catch(()=>({}));
  if(!response.ok||!result.success)throw new Error(result.message||"تعذر تحميل بيانات الحساب.");
  const savedName=String(result.playerName||result.displayName||result.username||result.name||"").trim();
  nameField.value=savedName;
  bioField.value=String(result.bio||"").slice(0,200);
  originalPlayerName=nameField.value.trim();originalBio=bioField.value.trim();nameWasEdited=false;bioWasEdited=false;
  bioCount.textContent=bioField.value.length+" من 200 حرف";
  email.textContent=result.email||user.email||"لا يوجد بريد إلكتروني";
  say(savedName?"تم تحميل بيانات الحساب.":"لم نعثر على اسم محفوظ لهذا الحساب. يمكنك إدخال اسمك وحفظه.");
 }catch(error){
  // Read-only fallback keeps the page usable if the profile API is temporarily unavailable.
  try{
   const user=activeUser||auth.currentUser;
   if(user){
    const snap=await getDoc(doc(db,"users",user.uid));
    const data=snap.exists()?snap.data():{};
    nameField.value=String(data.playerName||data.displayName||data.username||user.displayName||"").trim();
    bioField.value=String(data.bio||"").slice(0,200);
    originalPlayerName=nameField.value.trim();originalBio=bioField.value.trim();
    bioCount.textContent=bioField.value.length+" من 200 حرف";
    email.textContent=user.email||"لا يوجد بريد إلكتروني";
    say(nameField.value?"تم تحميل بيانات الحساب من قاعدة البيانات.":"تعذر تحديد الاسم المحفوظ. يمكنك إدخاله وحفظه.");
   }else{say("تعذر التحقق من الحساب. أعد تحميل الصفحة.");}
  }catch(fallbackError){
   say("تعذر تحميل بيانات الملف الشخصي. تحقق من الاتصال ثم أعد المحاولة.");
   console.error("Profile load failed:",error?.message,fallbackError?.message);
  }
 }finally{
  profileReady=true;
  save.disabled=!activeUser;
 }
})();
form.addEventListener("submit",async event=>{event.preventDefault();if(!activeUser||!profileReady){say("انتظر حتى يكتمل تحميل بيانات الحساب.");return;}let playerName=nameField.value.trim();const bio=bioField.value.trim();const nameChanged=nameWasEdited||playerName!==originalPlayerName;const bioChanged=bioWasEdited||bio!==originalBio;if(!playerName){try{const token=await activeUser.getIdToken();const response=await fetch(apiBase+"/api/profile/me",{headers:{Authorization:"Bearer "+token},cache:"no-store"});const result=await response.json().catch(()=>({}));playerName=String(result.playerName||result.displayName||result.username||result.name||activeUser.displayName||"").trim();if(playerName)nameField.value=playerName;}catch(error){playerName=String(activeUser.displayName||"").trim();if(playerName)nameField.value=playerName;}}if(playerName.length<2||playerName.length>30){say("اسم المستخدم يجب أن يكون بين حرفين و30 حرفًا.");nameField.focus();return}if(hasInappropriateName(playerName)){say("هذا الاسم قد يحتوي على لفظ مسيء أو غير لائق. يرجى اختيار اسم آخر.");nameField.focus();return}if(bio.length>200){say("النبذة الشخصية لا يمكن أن تتجاوز 200 حرف.");bioField.focus();return}save.disabled=true;say("جارٍ حفظ بيانات الحساب...");try{const token=await activeUser.getIdToken(true);const response=await fetch(apiBase+"/api/profile/me",{method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({playerName,bio}),cache:"no-store"});const result=await response.json().catch(()=>({}));if(!response.ok||!result.success)throw new Error(result.message||"تعذر حفظ الملف الشخصي.");await activeUser.reload();nameField.value=result.playerName||playerName;bioField.value=result.bio??bio;bioCount.textContent=bioField.value.length+" من 200 حرف";originalPlayerName=nameField.value.trim();originalBio=bioField.value.trim();say(nameChanged&&bioChanged?"تم حفظ الاسم والنبذة الشخصية بنجاح.":nameChanged?"تم تغيير اسم المستخدم بنجاح.":bioChanged?"تم تحديث النبذة الشخصية بنجاح.":"لم يتم إجراء أي تغييرات على بيانات الحساب.")}catch(error){say("تعذر حفظ بيانات الحساب: "+(error.message||error.code||"خطأ غير معروف"))}finally{save.disabled=false}});
</script><script>document.addEventListener("click",function(event){const button=event.target.closest("button[data-navigate]");if(button){location.href=button.dataset.navigate;}});</script><script src="diagnostics.js" defer></script><script>
(function(){
 function stopCheckboxParentClick(event){
  const target=event.target;
  if(target && target.closest && target.closest('input[type="checkbox"]')) event.stopPropagation();
 }
 document.addEventListener('click',stopCheckboxParentClick,true);
 document.addEventListener('change',stopCheckboxParentClick,true);
})();
</script>

</body></html>
