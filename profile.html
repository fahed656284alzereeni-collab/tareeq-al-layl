<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>الملف الشخصي - مِرسالو</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#101827;color:#f5f7fb}*{box-sizing:border-box}body{margin:0;line-height:1.8;padding:18px}main{max-width:560px;margin:24px auto;background:#1b293b;border:1px solid #34445a;border-radius:18px;padding:22px}h1{color:#8bd8c5;margin-top:0}label{display:block;font-weight:bold;margin:14px 0 5px}input,button,a{font:inherit}input[type=text]{width:100%;padding:12px;border-radius:10px;margin:5px 0;background:#fff;color:#111}button,.link{display:block;width:100%;padding:13px;border:0;border-radius:10px;margin:12px 0;background:#167c68;color:white;text-align:center;text-decoration:none;font-weight:bold}.secondary{background:#42536b}button:focus,input:focus{outline:3px solid #ffd166;outline-offset:3px}#status{padding:12px;background:#26384e;border-radius:10px}#avatar{width:112px;height:112px;border-radius:50%;background:#30465d;color:#8bd8c5;display:flex;align-items:center;justify-content:center;margin:12px auto;font-size:42px;font-weight:bold}.muted{color:#c3d0df}
</style><link rel="stylesheet" href="/mersalo-theme.css?v=20261104"><script>/* Visible text, without heading-level announcements. */(()=>{const s="h1,h2,h3,h4,h5,h6";const a=r=>{if(r.nodeType!==1)return;if(r.matches?.(s))r.setAttribute("role","generic");r.querySelectorAll?.(s).forEach(e=>e.setAttribute("role","generic"));};const m=()=>{a(document.documentElement);new MutationObserver(rs=>rs.forEach(x=>x.addedNodes.forEach(a))).observe(document.documentElement,{childList:true,subtree:true});};if(document.documentElement)m();else document.addEventListener("DOMContentLoaded",m,{once:true});})();</script>
</head><body><main>
<button class="link secondary" type="button" data-navigate="settings.html">رجوع إلى الإعدادات</button>
<h1 role="generic">الملف الشخصي</h1><p class="muted">يمكنك تعديل اسم المستخدم وإدارة حسابك.</p>
<div id="avatar" role="img" aria-label="صورة افتراضية لمِرسالو">م</div>
<p id="email" class="muted" aria-live="polite">جارٍ تحميل بيانات الحساب...</p>
<form id="profileForm"><label for="playerName">اسم المستخدم</label><input id="playerName" type="text" maxlength="30" minlength="2" required autocomplete="nickname"><label for="profileBio">نبذة شخصية (حتى 200 حرف)</label><textarea id="profileBio" maxlength="200" rows="4" aria-describedby="bioCount" placeholder="اكتب نبذة قصيرة عن نفسك"></textarea><p id="bioCount" class="muted" aria-live="polite">0 من 200 حرف</p><button id="save" type="submit">حفظ التغييرات</button></form>
<p id="status" role="status" aria-live="polite">جارٍ تحميل الملف الشخصي...</p>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,onAuthStateChanged,updateProfile}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDQZpAJgNCqd4iXyJyN9zFC-8LneS_UWQs",authDomain:"tareeq-al-layl.firebaseapp.com",projectId:"tareeq-al-layl",storageBucket:"tareeq-al-layl.firebasestorage.app",messagingSenderId:"1071185437335",appId:"1:1071185437335:web:4ca6e3f87152f9ef68ffd2"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const apiBase="https://tareeq-al-layl-server.onrender.com";
const form=document.getElementById("profileForm"),nameField=document.getElementById("playerName"),bioField=document.getElementById("profileBio"),bioCount=document.getElementById("bioCount"),email=document.getElementById("email"),status=document.getElementById("status"),save=document.getElementById("save");
bioField.addEventListener("input",()=>{bioCount.textContent=bioField.value.length+" من 200 حرف"});
let activeUser=null;function say(message){status.textContent=message}
const inappropriateNameTerms=["كس","شرموط","شرموطة","قحبة","منيوك","منيوكة","خول","طيز","زب","متناك","عاهرة","fuck","fucker","motherfucker","shithead","bitch","cunt","nigger","faggot","whore","slut","rape","puta","puto","mierda","joder","caralho","viado","putain","merde","salope","connard","encule","arschloch","scheisse","hure","schlampe","блядь","сука","хуй","пизда","ебать","мудак","orospu","siktir","amk","vaffanculo","stronzo","troia","puttana","gaand","chutiya","bhenchod","madarchod","haramzada"];
function normalizeName(value){return String(value||"").normalize("NFKD").replace(/[\\u0300-\\u036f\\u064b-\\u065f\\u0670\\u06d6-\\u06ed]/g,"").toLocaleLowerCase().replace(/[0@]/g,"o").replace(/[1!|]/g,"i").replace(/[3]/g,"e").replace(/[4@]/g,"a").replace(/[5$]/g,"s").replace(/[7]/g,"t").replace(/[\\s._*\\-]+/g,"")}
function hasInappropriateName(value){const normalized=normalizeName(value);return inappropriateNameTerms.some(term=>normalized.includes(normalizeName(term)))}
onAuthStateChanged(auth,async user=>{if(!user){location.replace("login.html");return}activeUser=user;try{const snap=await getDoc(doc(db,"users",user.uid));const data=snap.exists()?snap.data():{};nameField.value=data.playerName||user.displayName||"";bioField.value=String(data.bio||"").slice(0,200);bioCount.textContent=bioField.value.length+" من 200 حرف";email.textContent=user.email||"لا يوجد بريد إلكتروني";say("تم تحميل بيانات الحساب.")}catch(error){say("تعذر تحميل الملف الشخصي. رمز الخطأ: "+(error.code||"unknown"))}});
form.addEventListener("submit",async event=>{event.preventDefault();if(!activeUser)return;const playerName=nameField.value.trim();if(playerName.length<2){say("اسم المستخدم يجب أن يتكون من حرفين على الأقل.");nameField.focus();return}if(hasInappropriateName(playerName)){say("هذا الاسم قد يحتوي على لفظ مسيء أو غير لائق. يرجى اختيار اسم آخر.");nameField.focus();return}save.disabled=true;try{const token=await activeUser.getIdToken();const check=await fetch(apiBase+"/api/name-check",{method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({name:playerName})});const checkResult=await check.json().catch(()=>({}));if(!check.ok||!checkResult.success)throw new Error(checkResult.message||"هذا الاسم غير مسموح به.");await updateProfile(activeUser,{displayName:playerName});await setDoc(doc(db,"users",activeUser.uid),{uid:activeUser.uid,email:activeUser.email||"",displayName:playerName,playerName,bio:bioField.value.trim().slice(0,200)},{merge:true});say("تم حفظ الملف الشخصي بنجاح.")}catch(error){say("تعذر حفظ الاسم: "+(error.message||error.code||"خطأ غير معروف"))}finally{save.disabled=false}});
</script><script>document.addEventListener("click",function(event){const button=event.target.closest("button[data-navigate]");if(button){location.href=button.dataset.navigate;}});</script><script src="diagnostics.js" defer></script><script>
(function(){
 function stopCheckboxParentClick(event){
  const target=event.target;
  if(target && target.closest && target.closest('input[type="checkbox"]')) event.stopPropagation();
 }
 document.addEventListener('click',stopCheckboxParentClick,true);
 document.addEventListener('change',stopCheckboxParentClick,true);
})();
</script>
<script>
/* Keep heading appearance while preventing screen readers from announcing heading levels. */
(()=>{const apply=root=>{if(root.matches?.("h1,h2,h3,h4,h5,h6"))root.setAttribute("role","generic");root.querySelectorAll?.("h1,h2,h3,h4,h5,h6").forEach(el=>el.setAttribute("role","generic"));};apply(document);new MutationObserver(records=>records.forEach(record=>record.addedNodes.forEach(node=>{if(node.nodeType===1)apply(node);}))).observe(document.documentElement,{childList:true,subtree:true});})();
</script>
</body></html>
