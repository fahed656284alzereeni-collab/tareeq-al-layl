<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>اختبار تسجيل الدخول — مرسال</title>
  <style>
    :root{color-scheme:dark;font-family:Arial,sans-serif;background:#101827;color:#f5f7fb}
    *{box-sizing:border-box}body{margin:0;padding:20px;line-height:1.8}
    main{max-width:520px;margin:6vh auto;padding:24px;background:#1b293b;border:1px solid #34445a;border-radius:18px}
    h1{font-size:1.5rem;color:#8bd8c5}p{overflow-wrap:anywhere}
    button{width:100%;padding:15px;margin-top:16px;border:0;border-radius:10px;background:#167c68;color:white;font-size:18px;font-weight:bold}
    button:focus-visible,a:focus-visible{outline:3px solid #ffd166;outline-offset:4px}
    #status{padding:14px;border-radius:10px;background:#26384e;min-height:56px}
    [hidden]{display:none!important}
  </style>
</head>
<body>
<main>
  <h1>اختبار تسجيل الدخول إلى مرسال</h1>
  <p>هذه صفحة اختبار مستقلة على فرع التطوير. لا تغيّر صفحة الدخول الأساسية ولا تفتح المحادثات.</p>
  <button id="google" type="button">تسجيل الدخول باستخدام Google</button>
  <p id="status" role="status" aria-live="polite">جارٍ التحقق من جلسة الاختبار...</p>
  <button id="signout" type="button" hidden>إنهاء جلسة الاختبار</button>
</main>
<script type="module">
import { supabase } from "./supabase-client.js";

const status = document.getElementById("status");
const googleButton = document.getElementById("google");
const signoutButton = document.getElementById("signout");
const say = (message) => { status.textContent = message; };

async function inspectSession() {
  googleButton.disabled = true;
  try {
    const { data: { session }, error } = await supabase.auth.getSession();
    if (error) throw error;
    if (!session) {
      say("لا توجد جلسة اختبار. يمكنك تسجيل الدخول بحساب Google.");
      googleButton.disabled = false;
      signoutButton.hidden = true;
      return;
    }

    say("نجح تسجيل الدخول إلى Supabase. جارٍ فحص الملف الشخصي...");
    const { data: profile, error: profileError } = await supabase
      .from("profiles")
      .select("id,display_name,avatar_url")
      .eq("id", session.user.id)
      .maybeSingle();

    if (profileError) {
      say("نجح تسجيل الدخول، لكن تعذر قراءة الملف الشخصي. تحقق من ترحيل قاعدة البيانات وسياسات RLS. التفاصيل: " + profileError.message);
    } else if (!profile) {
      say("نجح تسجيل الدخول، لكن الملف الشخصي غير موجود. يلزم تطبيق ترحيل إنشاء الملف الشخصي على بيئة الاختبار قبل اعتماد الدخول.");
    } else {
      say("نجح تسجيل الدخول وقراءة الملف الشخصي. الاسم: " + (profile.display_name || "غير محدد") + ". لم يتم فتح المحادثات لأن واجهتها ما زالت على نظام الدخول القديم.");
    }
    signoutButton.hidden = false;
  } catch (error) {
    say("تعذر فحص جلسة الاختبار: " + (error.message || "خطأ غير معروف"));
    googleButton.disabled = false;
  }
}

googleButton.addEventListener("click", async () => {
  googleButton.disabled = true;
  say("جارٍ تحويلك إلى Google...");
  const redirectTo = new URL("./supabase-auth-preview.html", window.location.href).toString();
  const { error } = await supabase.auth.signInWithOAuth({
    provider: "google",
    options: { redirectTo }
  });
  if (error) {
    say("تعذر بدء تسجيل الدخول: " + error.message);
    googleButton.disabled = false;
  }
});

signoutButton.addEventListener("click", async () => {
  signoutButton.disabled = true;
  const { error } = await supabase.auth.signOut();
  if (error) {
    say("تعذر إنهاء الجلسة: " + error.message);
    signoutButton.disabled = false;
    return;
  }
  say("تم إنهاء جلسة الاختبار.");
  signoutButton.hidden = true;
  signoutButton.disabled = false;
  googleButton.disabled = false;
});

await inspectSession();
</script>
</body>
</html>
