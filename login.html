<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>تسجيل الدخول - طريق الليل</title>

  <style>

    body {

      font-family: Arial, sans-serif;

      background: #101522;

      color: white;

      margin: 0;

      padding: 25px;

      line-height: 1.8;

    }

    main {

      max-width: 420px;

      margin: 35px auto;

      background: #1c2638;

      padding: 24px;

      border-radius: 16px;

    }

    h1, p { text-align: center; }

    label {

      display: block;

      margin-top: 15px;

    }

    input, button {

      box-sizing: border-box;

      width: 100%;

      padding: 14px;

      margin-top: 8px;

      border-radius: 8px;

      font-size: 17px;

    }

    input {

      border: 1px solid #77849a;

    }

    button {

      border: 0;

      background: #3978df;

      color: white;

      cursor: pointer;

      margin-top: 16px;

    }

    button:focus, input:focus {

      outline: 3px solid #ffcf55;

    }

    #playerNameSetup { display:none; margin-top:18px; }

    #message {

      margin-top: 18px;

      text-align: center;

      overflow-wrap: anywhere;

    }

  </style>

</head>

<body>

<main>

  <h1>طريق الليل</h1>

  <p>مرحباً بك. سجّل الدخول للمتابعة.</p>

  <button id="googleButton">تسجيل الدخول باستخدام Google</button>

  <label for="email">البريد الإلكتروني</label>

  <input id="email" type="email" autocomplete="email">

  <label for="password">كلمة المرور</label>

  <input id="password" type="password" autocomplete="current-password">

  <button id="loginButton">تسجيل الدخول</button>

  <button id="registerButton">إنشاء حساب جديد</button>

  <div id="playerNameSetup">
    <label for="playerName">اسم اللاعب الذي سيظهر للآخرين</label>
    <input id="playerName" maxlength="30" autocomplete="nickname">
    <button id="savePlayerNameButton">حفظ الاسم والدخول إلى اللعبة</button>
  </div>

  <p id="message" role="status" aria-live="polite"></p>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, browserLocalPersistence, setPersistence,
  signInWithPopup, signInWithRedirect, getRedirectResult,
  signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyDQZpAJgNCqd4iXyJyN9zFC-8LneS_UWQs",
  authDomain: "tareeq-al-layl.firebaseapp.com",
  projectId: "tareeq-al-layl",
  storageBucket: "tareeq-al-layl.firebasestorage.app",
  messagingSenderId: "1071185437335",
  appId: "1:1071185437335:web:4ca6e3f87152f9ef68ffd2"
});
const auth = getAuth(app);
const db = getFirestore(app);
const message = document.getElementById("message");
const googleButton = document.getElementById("googleButton");
function showMessage(text) { message.textContent = text; }
let activeUser = null;
let processingUid = null;
let handledUid = null;

async function saveProfile(user) {
  await setDoc(doc(db, "users", user.uid), {
    uid: user.uid,
    email: user.email || "",
    displayName: user.displayName || "",
    photoURL: user.photoURL || "",
    updatedAt: serverTimestamp()
  }, { merge: true });
}

async function continueWithUser(user) {
  if (!user || processingUid === user.uid || handledUid === user.uid) return;
  processingUid = user.uid;
  activeUser = user;
  try {
    showMessage("جارٍ التحقق من ملفك الشخصي.");
    await saveProfile(user);
    const snap = await getDoc(doc(db, "users", user.uid));
    const playerName = snap.exists() ? String(snap.data().playerName || "").trim() : "";
    handledUid = user.uid;
    if (!playerName) {
      document.getElementById("playerNameSetup").style.display = "block";
      document.getElementById("playerName").focus();
      showMessage("اكتب اسم اللاعب مرة واحدة لإكمال إعداد الحساب.");
      return;
    }
    showMessage("تم تسجيل الدخول. جارٍ فتح اللعبة.");
    location.replace("online.html");
  } catch (error) {
    handledUid = null;
    showMessage("تعذر تجهيز الحساب. رمز الخطأ: " + (error.code || "unknown"));
  } finally {
    processingUid = null;
  }
}

async function initializeLogin() {
  try {
    await setPersistence(auth, browserLocalPersistence);
  } catch (error) {
    showMessage("تعذر حفظ جلسة الدخول على هذا المتصفح. رمز الخطأ: " + (error.code || "unknown"));
  }
  try {
    const result = await getRedirectResult(auth);
    if (result && result.user) await continueWithUser(result.user);
  } catch (error) {
    showMessage("فشل إكمال تسجيل Google. رمز الخطأ: " + (error.code || "unknown"));
  }
  onAuthStateChanged(auth, user => {
    if (!user) {
      activeUser = null;
      handledUid = null;
      processingUid = null;
      return;
    }
    continueWithUser(user);
  });
}

document.getElementById("savePlayerNameButton").addEventListener("click", async () => {
  const playerName = document.getElementById("playerName").value.trim();
  if (!activeUser) { showMessage("سجّل الدخول أولاً."); return; }
  if (!playerName) { showMessage("اسم اللاعب مطلوب."); return; }
  if (playerName.length > 30) { showMessage("الاسم يجب ألا يتجاوز 30 حرفاً."); return; }
  try {
    await setDoc(doc(db, "users", activeUser.uid), {
      uid: activeUser.uid, email: activeUser.email || "",
      displayName: activeUser.displayName || "", photoURL: activeUser.photoURL || "",
      playerName, updatedAt: serverTimestamp()
    }, { merge: true });
    showMessage("تم حفظ الاسم. جارٍ فتح اللعبة.");
    location.replace("online.html");
  } catch (error) {
    showMessage("تعذر حفظ الاسم. رمز الخطأ: " + (error.code || "unknown"));
  }
});

googleButton.addEventListener("click", async () => {
  googleButton.disabled = true;
  try {
    showMessage("جارٍ تجهيز تسجيل الدخول باستخدام Google.");
    await setPersistence(auth, browserLocalPersistence);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    try {
      const result = await signInWithPopup(auth, provider);
      await continueWithUser(result.user);
    } catch (error) {
      const fallbackCodes = ["auth/popup-blocked", "auth/popup-closed-by-user", "auth/cancelled-popup-request", "auth/operation-not-supported-in-this-environment"];
      if (fallbackCodes.includes(error.code)) {
        showMessage("سيتم فتح صفحة Google لتسجيل الدخول.");
        await signInWithRedirect(auth, provider);
        return;
      }
      throw error;
    }
  } catch (error) {
    googleButton.disabled = false;
    const code = error.code || "unknown";
    const messages = {
      "auth/unauthorized-domain": "نطاق الموقع غير مصرح به في Firebase.",
      "auth/operation-not-allowed": "تسجيل Google غير مفعّل في Firebase.",
      "auth/network-request-failed": "تعذر الاتصال بالإنترنت. حاول مرة أخرى.",
      "auth/account-exists-with-different-credential": "هذا البريد مسجل بطريقة دخول أخرى."
    };
    showMessage((messages[code] || "تعذر تسجيل الدخول باستخدام Google.") + " رمز الخطأ: " + code);
  }
});

document.getElementById("loginButton").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (!email || !password) { showMessage("أدخل البريد الإلكتروني وكلمة المرور."); return; }
  try { await signInWithEmailAndPassword(auth, email, password); }
  catch (error) { showMessage("فشل تسجيل الدخول. رمز الخطأ: " + (error.code || "unknown")); }
});

document.getElementById("registerButton").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (!email || !password) { showMessage("أدخل البريد الإلكتروني وكلمة المرور."); return; }
  if (password.length < 6) { showMessage("كلمة المرور يجب أن تكون 6 أحرف على الأقل."); return; }
  try { await createUserWithEmailAndPassword(auth, email, password); }
  catch (error) { showMessage("تعذر إنشاء الحساب. رمز الخطأ: " + (error.code || "unknown")); }
});

initializeLogin();
</script>

</body>

</html>
