<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>الدخول إلى مِرسالو</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#101827;color:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:22px;line-height:1.8}body.name-step{padding:0;overflow:hidden}body.name-step main{position:fixed;inset:0;z-index:10000;width:100vw;height:100vh;height:100dvh;max-width:none;margin:0;padding:calc(28px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));border:0;border-radius:0;overflow-y:auto;display:flex;flex-direction:column;justify-content:center}body.name-step main>h1,body.name-step main>p:not(#status){display:none}main{max-width:480px;margin:5vh auto;background:#1b293b;border:1px solid #34445a;border-radius:22px;padding:24px}h1{text-align:center;color:#8bd8c5}button{width:100%;padding:15px;margin-top:18px;border-radius:11px;font-size:18px;background:#167c68;color:#fff;border:0;font-weight:bold;cursor:pointer}button:focus,input:focus{outline:3px solid #ffd166;outline-offset:3px}button:disabled{opacity:.55}input{width:100%;padding:14px;border-radius:10px;font:inherit;margin-top:8px}#status{margin-top:20px;padding:12px;border-radius:10px;background:#26384e;overflow-wrap:anywhere}.note{font-size:.92rem;color:#c3d0df}#nameForm{display:none}
</style><link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#101827">
</head><body><main>
<h1>مِرسالو</h1><p>سجّل الدخول أو أنشئ حسابك باستخدام حساب Google.</p>
<button id="googleLogin" type="button">المتابعة باستخدام Google</button>
<button id="developerEmergency" type="button" style="background:#42536b">مركز الطوارئ للمطوّر</button>
<section id="developerEmergencyPanel" hidden aria-labelledby="developerEmergencyTitle"><h2 id="developerEmergencyTitle" tabindex="-1">مركز الطوارئ للمطوّر</h2><p>يتطلب التحقق من حساب المطوّر. الأداة المتاحة حاليًا هي فحص حالة الخادم.</p><button id="developerEmergencyCheck" type="button">فحص حالة الخادم</button><p id="developerEmergencyStatus" role="status" aria-live="polite"></p></section>
<form id="nameForm"><label for="displayName">ما الاسم الذي تريد أن يظهر للآخرين ويبحثوا عنك به؟</label><input id="displayName" type="text" maxlength="30" autocomplete="off" required><button type="submit">حفظ الاسم وفتح مِرسالو</button></form>
<p class="note">ستظهر نافذة Google لاختيار الحساب. لا تحتاج إلى إدخال بريدك أو كلمة المرور داخل مِرسالو.</p>
<p id="status" role="status" aria-live="polite">اضغط على زر المتابعة باستخدام Google.</p>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDQZpAJgNCqd4iXyJyN9zFC-8LneS_UWQs",authDomain:"tareeq-al-layl.firebaseapp.com",projectId:"tareeq-al-layl",storageBucket:"tareeq-al-layl.firebasestorage.app",messagingSenderId:"1071185437335",appId:"1:1071185437335:web:4ca6e3f87152f9ef68ffd2"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
// Wake the free Render instance while Firebase restores the saved login session.
// This runs in parallel and never blocks sign-in or account loading.
fetch("https://tareeq-al-layl-server.onrender.com/health",{cache:"no-store",keepalive:true}).catch(()=>{});
// Keep the Firebase session on this browser without blocking login UI indefinitely.
provider.setCustomParameters({prompt:"select_account"});
const button=document.getElementById("googleLogin"),form=document.getElementById("nameForm"),nameInput=document.getElementById("displayName"),status=document.getElementById("status");
function withTimeout(promise,ms,label){return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label)),ms))])}
try{await withTimeout(setPersistence(auth,browserLocalPersistence),8000,"persistence-timeout")}catch(e){console.warn("Firebase persistence setup delayed or unavailable:",e)}
let currentUser=null,profileRef=null,checking=false;
const emergencyButton=document.getElementById("developerEmergency");
const emergencyPanel=document.getElementById("developerEmergencyPanel");
const emergencyStatus=document.getElementById("developerEmergencyStatus");
emergencyButton.addEventListener("click",async()=>{
 sessionStorage.setItem("mersalo-developer-emergency","1");
 emergencyButton.disabled=true;
 say("يلزم تسجيل الدخول والتحقق من صلاحية المطوّر.");
 try{await signInWithPopup(auth,provider)}
 catch(error){sessionStorage.removeItem("mersalo-developer-emergency");emergencyButton.disabled=false;say("تعذر التحقق عبر Google. رمز الخطأ: "+(error.code||"unknown"))}
});
document.getElementById("developerEmergencyCheck").addEventListener("click",async()=>{
 emergencyStatus.textContent="جارٍ فحص الخادم...";
 try{
  if(!auth.currentUser)throw new Error("انتهت جلسة التحقق. أعد المحاولة.");
  const token=await auth.currentUser.getIdToken(true);
  const response=await fetch("https://tareeq-al-layl-server.onrender.com/api/admin/control-center/command",{method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({command:"health-check"})});
  const result=await response.json().catch(()=>({}));
  if(!response.ok||!result.success)throw new Error(result.message||"تعذر تنفيذ الفحص.");
  emergencyStatus.textContent=result.message+" مدة تشغيل الخادم: "+result.result.uptimeSeconds+" ثانية.";
 }catch(error){emergencyStatus.textContent=error.message||"تعذر فحص الخادم."}
});

function say(t){status.textContent=t}
button.addEventListener("click",async()=>{button.disabled=true;say("جارٍ فتح نافذة Google لاختيار الحساب...");try{await signInWithPopup(auth,provider)}catch(e){button.disabled=false;say("تعذر تسجيل الدخول باستخدام Google. رمز الخطأ: "+(e.code||"unknown"))}});
onAuthStateChanged(auth,async user=>{
 if(!user||checking)return;checking=true;currentUser=user;button.disabled=true;say("جارٍ التحقق من ملف حسابك...");
 if(sessionStorage.getItem("mersalo-developer-emergency")==="1"){
  sessionStorage.removeItem("mersalo-developer-emergency");
  try{
   const token=await user.getIdToken(true);
   const response=await fetch("https://tareeq-al-layl-server.onrender.com/api/admin/control-center/status",{headers:{Authorization:"Bearer "+token}});
   const result=await response.json().catch(()=>({}));
   if(!response.ok||!result.success)throw new Error(result.message||"هذا الحساب غير مخوّل.");
   say("تم التحقق من صلاحية المطوّر. جارٍ فتح لوحة الإدارة الكاملة.");
   location.replace("settings.html?section=admin");
   return;
  }catch(error){emergencyButton.disabled=false;say(error.message||"تعذر التحقق من صلاحية المطوّر.");}
  checking=false;return;
 }

 try{
  const controlResponse=await withTimeout(fetch("https://tareeq-al-layl-server.onrender.com/api/public/system-settings",{cache:"no-store"}),12000,"system-settings-timeout");
  const controlData=await controlResponse.json().catch(()=>({}));
  if(!controlResponse.ok||!controlData.success)throw new Error("تعذر التحقق من حالة الموقع. حاول مرة أخرى.");
  profileRef=doc(db,"users",user.uid);say("تم تسجيل الدخول. جارٍ تحميل ملف حسابك...");const snap=await withTimeout(getDoc(profileRef),15000,"profile-timeout");const data=snap.exists()?snap.data():{};
  const isDeveloper=String(user.email||"").toLowerCase()==="fahed656284alzereeni@gmail.com";
  if(controlData.settings?.maintenance&&!isDeveloper){say("مِرسالو في وضع الصيانة حاليًا. يرجى المحاولة لاحقًا.");checking=false;button.disabled=false;return}
  if(!snap.exists()&&controlData.settings?.registrationOpen===false){say("إنشاء الحسابات الجديدة متوقف مؤقتًا. يمكنك المحاولة لاحقًا.");checking=false;button.disabled=false;return}
  if(data.playerName){say("أهلًا بعودتك "+data.playerName+". جارٍ فتح مِرسالو.");location.replace("chat.html");return}
  nameInput.value="";
  form.style.display="block";button.style.display="none";document.body.classList.add("name-step");nameInput.focus();say("قبل إكمال إنشاء الحساب، اختر الاسم الذي سيظهر للآخرين عند البحث عنك.");
 }catch(e){checking=false;button.disabled=false;const code=e.code||e.message||"unknown";say(code==="profile-timeout"?"تأخر الاتصال بملف حسابك. تحقق من اتصال الإنترنت ثم أعد المحاولة.":"تعذر قراءة ملف الحساب. رمز الخطأ: "+code)}
});
form.addEventListener("submit",async e=>{
 e.preventDefault();const playerName=nameInput.value.trim();
 if(playerName.length<2){say("اكتب اسمًا من حرفين على الأقل.");nameInput.focus();return}
 if(!currentUser||!profileRef){say("تعذر التحقق من حسابك. أعد تسجيل الدخول.");return}
 const save=form.querySelector("button");save.disabled=true;say("جارٍ حفظ اسمك...");
 try{
  await setDoc(profileRef,{uid:currentUser.uid,email:currentUser.email||"",displayName:playerName,playerName,photoURL:currentUser.photoURL||"",createdAt:serverTimestamp(),lastLoginAt:serverTimestamp()},{merge:true});
  // Welcome email is best-effort and must never delay opening the app after the profile is saved.
  currentUser.getIdToken().then(token=>fetch("https://tareeq-al-layl-server.onrender.com/api/welcome-email",{method:"POST",headers:{Authorization:"Bearer "+token},keepalive:true})).catch(()=>{});
  say("تم حفظ اسمك بنجاح. جارٍ فتح مِرسالو.");
  location.replace("chat.html");
 }catch(e){
  save.disabled=false;
  say("تعذر حفظ الاسم. رمز الخطأ: "+(e.code||"unknown"));
 }
});
</script><script src="diagnostics.js" defer></script></body></html>
