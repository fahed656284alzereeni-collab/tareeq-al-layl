<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>الدخول إلى مِرسالو</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#101827;color:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:22px;line-height:1.8}main{max-width:480px;margin:5vh auto;background:#1b293b;border:1px solid #34445a;border-radius:22px;padding:24px}h1{text-align:center;color:#8bd8c5}button{width:100%;padding:15px;margin-top:18px;border-radius:11px;font-size:18px;background:#167c68;color:#fff;border:0;font-weight:bold;cursor:pointer}button:focus,input:focus{outline:3px solid #ffd166;outline-offset:3px}button:disabled{opacity:.55}input{width:100%;padding:14px;border-radius:10px;font:inherit;margin-top:8px}#status{margin-top:20px;padding:12px;border-radius:10px;background:#26384e;overflow-wrap:anywhere}.note{font-size:.92rem;color:#c3d0df}#nameForm{display:none}
</style></head><body><main>
<h1>مِرسالو</h1><p>سجّل الدخول أو أنشئ حسابك باستخدام حساب Google.</p>
<button id="googleLogin" type="button">المتابعة باستخدام Google</button>
<form id="nameForm"><label for="displayName">ما الاسم الذي تريد أن يظهر للآخرين ويبحثوا عنك به؟</label><input id="displayName" type="text" maxlength="30" autocomplete="off" required><button type="submit">حفظ الاسم وفتح مِرسالو</button></form>
<p class="note">ستظهر نافذة Google لاختيار الحساب. لا تحتاج إلى إدخال بريدك أو كلمة المرور داخل مِرسالو.</p>
<p id="status" role="status" aria-live="polite">اضغط على زر المتابعة باستخدام Google.</p>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,setPersistence,browserLocalPersistence}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDQZpAJgNCqd4iXyJyN9zFC-8LneS_UWQs",authDomain:"tareeq-al-layl.firebaseapp.com",projectId:"tareeq-al-layl",storageBucket:"tareeq-al-layl.firebasestorage.app",messagingSenderId:"1071185437335",appId:"1:1071185437335:web:4ca6e3f87152f9ef68ffd2"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
// Keep the Firebase session on this browser without blocking login UI indefinitely.
provider.setCustomParameters({prompt:"select_account"});
const button=document.getElementById("googleLogin"),form=document.getElementById("nameForm"),nameInput=document.getElementById("displayName"),status=document.getElementById("status");
function withTimeout(promise,ms,label){return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label)),ms))])}
try{await withTimeout(setPersistence(auth,browserLocalPersistence),8000,"persistence-timeout")}catch(e){console.warn("Firebase persistence setup delayed or unavailable:",e)}
let currentUser=null,profileRef=null,checking=false,loginAudioContext=null;
function prepareLoginAudio(){
 try{
  const AudioContextClass=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextClass)return;
  if(!loginAudioContext)loginAudioContext=new AudioContextClass();
  if(loginAudioContext.state==="suspended")loginAudioContext.resume().catch(()=>{});
 }catch(e){}
}
async function playLoginSound(){
 try{
  prepareLoginAudio();
  if(!loginAudioContext)return;
  if(loginAudioContext.state==="suspended")await loginAudioContext.resume();
  const ctx=loginAudioContext,now=ctx.currentTime;
  [[523.25,0],[659.25,.16],[783.99,.32],[1046.5,.5]].forEach(([frequency,offset])=>{
   const osc=ctx.createOscillator(),gain=ctx.createGain();
   osc.type="sine";osc.frequency.setValueAtTime(frequency,now+offset);
   gain.gain.setValueAtTime(.0001,now+offset);
   gain.gain.exponentialRampToValueAtTime(.16,now+offset+.025);
   gain.gain.exponentialRampToValueAtTime(.0001,now+offset+.32);
   osc.connect(gain);gain.connect(ctx.destination);
   osc.start(now+offset);osc.stop(now+offset+.34);
  });
  await new Promise(resolve=>setTimeout(resolve,900));
 }catch(e){}
}
function say(t){status.textContent=t}
button.addEventListener("click",async()=>{prepareLoginAudio();button.disabled=true;say("جارٍ فتح نافذة Google لاختيار الحساب...");try{await signInWithPopup(auth,provider)}catch(e){button.disabled=false;say("تعذر تسجيل الدخول باستخدام Google. رمز الخطأ: "+(e.code||"unknown"))}});
onAuthStateChanged(auth,async user=>{
 if(!user||checking)return;checking=true;currentUser=user;button.disabled=true;say("جارٍ التحقق من ملف حسابك...");
 try{
  profileRef=doc(db,"users",user.uid);say("تم تسجيل الدخول. جارٍ تحميل ملف حسابك...");const snap=await withTimeout(getDoc(profileRef),15000,"profile-timeout");const data=snap.exists()?snap.data():{};
  if(data.playerName){say("أهلًا بعودتك "+data.playerName+". جارٍ فتح مِرسالو.");await playLoginSound();location.replace("chat.html");return}
  nameInput.value="";
  form.style.display="block";button.style.display="none";nameInput.focus();say("قبل إكمال إنشاء الحساب، اختر الاسم الذي سيظهر للآخرين عند البحث عنك.");
 }catch(e){checking=false;button.disabled=false;const code=e.code||e.message||"unknown";say(code==="profile-timeout"?"تأخر الاتصال بملف حسابك. تحقق من اتصال الإنترنت ثم أعد المحاولة.":"تعذر قراءة ملف الحساب. رمز الخطأ: "+code)}
});
form.addEventListener("submit",async e=>{
 e.preventDefault();prepareLoginAudio();const playerName=nameInput.value.trim();
 if(playerName.length<2){say("اكتب اسمًا من حرفين على الأقل.");nameInput.focus();return}
 if(!currentUser||!profileRef)return;
 const save=form.querySelector("button");save.disabled=true;say("جارٍ حفظ اسمك...");
 try{await setDoc(profileRef,{uid:currentUser.uid,email:currentUser.email||"",displayName:playerName,playerName,photoURL:currentUser.photoURL||"",createdAt:serverTimestamp(),lastLoginAt:serverTimestamp()},{merge:true});say("تم إنشاء حسابك. جارٍ إرسال رسالة الترحيب إلى بريدك...");try{const token=await currentUser.getIdToken();const emailResponse=await fetch("https://tareeq-al-layl-server.onrender.com/api/welcome-email",{method:"POST",headers:{Authorization:"Bearer "+token}});const emailResult=await emailResponse.json();say(emailResult.success?"تم إنشاء حسابك وإرسال رسالة الترحيب إلى بريدك. جارٍ فتح مِرسالو.":"تم إنشاء حسابك، لكن تعذّر إرسال رسالة الترحيب حاليًا. جارٍ فتح مِرسالو.");}catch(emailError){say("تم إنشاء حسابك. تعذّر تأكيد إرسال رسالة الترحيب حاليًا. جارٍ فتح مِرسالو.");}await playLoginSound();location.replace("chat.html")}
 catch(e){save.disabled=false;say("تعذر حفظ الاسم. رمز الخطأ: "+(e.code||"unknown"))}
});
</script></body></html>
