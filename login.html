<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>الدخول إلى مِرسالو</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#101827;color:#f5f7fb}
*{box-sizing:border-box}body{margin:0;padding:22px;line-height:1.8}main{max-width:480px;margin:5vh auto;background:#1b293b;border:1px solid #34445a;border-radius:22px;padding:24px}
h1{text-align:center;color:#8bd8c5}label{display:block;margin-top:18px;font-weight:bold}
input,button{width:100%;padding:15px;margin-top:8px;border-radius:11px;font-size:18px}
input{background:#fff;color:#111;border:2px solid #718096}
button{background:#167c68;color:#fff;border:0;font-weight:bold;cursor:pointer}
button:focus,input:focus{outline:3px solid #ffd166;outline-offset:3px}
button:disabled{opacity:.55}
#status{margin-top:20px;padding:12px;border-radius:10px;background:#26384e;overflow-wrap:anywhere}
#codeArea{display:none}
.note{font-size:.92rem;color:#c3d0df}
</style>
</head>
<body><main>
<h1>مِرسالو</h1>
<p>الدخول وإنشاء الحساب برقم الهاتف فقط.</p>
<form id="phoneForm">
<label for="phone">رقم الهاتف مع مفتاح الدولة</label>
<input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+9627XXXXXXXX" required>
<button id="sendCode" type="submit">إرسال رمز التحقق</button>
</form>
<section id="codeArea" aria-label="التحقق من رقم الهاتف">
<label for="code">رمز التحقق الذي وصلك برسالة SMS</label>
<input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
<button id="verifyCode" type="button">تأكيد الرمز والدخول</button>
</section>
<div id="recaptcha-container"></div>
<p class="note">قد يطلب Firebase تحققاً إضافياً للتأكد من أن الطلب صادر عن شخص حقيقي.</p>
<p id="status" role="status" aria-live="polite">أدخل رقمك بالصيغة الدولية، مثال: +9627XXXXXXXX.</p>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,RecaptchaVerifier,signInWithPhoneNumber,setPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,doc,setDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDQZpAJgNCqd4iXyJyN9zFC-8LneS_UWQs",authDomain:"tareeq-al-layl.firebaseapp.com",projectId:"tareeq-al-layl",storageBucket:"tareeq-al-layl.firebasestorage.app",messagingSenderId:"1071185437335",appId:"1:1071185437335:web:4ca6e3f87152f9ef68ffd2"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const status=document.getElementById("status"),form=document.getElementById("phoneForm"),send=document.getElementById("sendCode"),codeArea=document.getElementById("codeArea");
let verifier=null,confirmation=null;
function say(t){status.textContent=t}
async function setupCaptcha(){
 if(verifier)return verifier;
 verifier=new RecaptchaVerifier(auth,"recaptcha-container",{size:"normal",callback:()=>say("تم اجتياز التحقق. اضغط إرسال الرمز إذا لم يبدأ الإرسال تلقائياً.") , "expired-callback":()=>say("انتهت صلاحية التحقق. أعد المحاولة.")});
 await verifier.render();return verifier;
}
form.addEventListener("submit",async e=>{
 e.preventDefault();const phone=document.getElementById("phone").value.trim();
 if(!/^\+[1-9]\d{7,14}$/.test(phone)){say("اكتب الرقم بالصيغة الدولية، مثل +9627XXXXXXXX.");return}
 send.disabled=true;
 try{await setPersistence(auth,browserLocalPersistence);const captcha=await setupCaptcha();confirmation=await signInWithPhoneNumber(auth,phone,captcha);codeArea.style.display="block";document.getElementById("code").focus();say("أرسلنا رمز التحقق إلى رقمك. أدخل الرمز المكوّن من ستة أرقام.");}
 catch(err){say("تعذر إرسال الرمز. رمز الخطأ: "+(err.code||"unknown")+" . تحقق من تفعيل Phone في Firebase وإعدادات SMS والنطاق المصرح.");if(verifier){try{await verifier.clear()}catch(_){}verifier=null}}
 finally{send.disabled=false}
});
document.getElementById("verifyCode").addEventListener("click",async()=>{
 const code=document.getElementById("code").value.trim();if(!confirmation){say("اطلب رمز التحقق أولاً.");return}if(!/^\d{6}$/.test(code)){say("أدخل رمزاً مكوّناً من ستة أرقام.");return}
 const button=document.getElementById("verifyCode");button.disabled=true;
 try{const result=await confirmation.confirm(code),user=result.user;await setDoc(doc(db,"users",user.uid),{uid:user.uid,phoneNumber:user.phoneNumber||"",createdAt:serverTimestamp(),lastLoginAt:serverTimestamp()},{merge:true});say("تم التحقق بنجاح. جارٍ فتح مِرسالو.");location.replace("chat.html")}
 catch(err){say("لم نتمكن من تأكيد الرمز. رمز الخطأ: "+(err.code||"unknown"))}
 finally{button.disabled=false}
});
</script></body></html>
